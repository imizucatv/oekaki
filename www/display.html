<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>みんなの水族館 - Real 3D Mesh Edition</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="みんなの水族館">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    html, body { 
      margin: 0; padding: 0;
      overflow: hidden; 
      width: 100vw; height: 100vh; height: 100dvh;
      background: linear-gradient(180deg, #0288d1 0%, #01579b 55%, #002f6c 100%);
      position: relative; font-family: sans-serif;
      overscroll-behavior: none; user-select: none;
    }

    #webgl-container {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    .sunbeams {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(
        110deg,
        rgba(255, 255, 255, 0.15) 0px,
        rgba(255, 255, 255, 0.15) 40px,
        transparent 40px,
        transparent 110px
      );
      pointer-events: none; z-index: 2;
    }
  </style>
</head>
<body>

  <div class="sunbeams"></div>
  <div id="webgl-container"></div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC0FLLOsSAd3fYvI1OI1KSUARostoV5HVM",
      authDomain: "espu9owen.firebaseapp.com",
      databaseURL: "https://espu9owen-default-rtdb.firebaseio.com",
      projectId: "espu9owen",
      storageBucket: "espu9owen.firebasestorage.app",
      messagingSenderId: "1003969526788",
      appId: "1:1003969526788:web:00a61b5a0cc2281de54951",
      measurementId: "G-GLW0L4Y53H"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const processedFoodKeys = new Set();
    const pageStartTime = Date.now();
    const MAX_LIFETIME = 120000;

    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();

    // 💡立体感が伝わるようにカメラを少し斜め上に配置
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
    camera.position.set(0, 20, 340);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // 💡立体感（凹凸の陰影）を強調する3Dライティング
    const ambientLight = new THREE.AmbientLight(0xdff0ff, 0.7);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 2.2);
    mainLight.position.set(120, 220, 180);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 1024;
    mainLight.shadow.mapSize.height = 1024;
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0x29b6f6, 1.0);
    fillLight.position.set(-100, -100, 100);
    scene.add(fillLight);

    // 砂地
    const seabedGeo = new THREE.PlaneGeometry(900, 400);
    const seabedMat = new THREE.MeshStandardMaterial({ color: 0xffe082, roughness: 0.9 });
    const seabed = new THREE.Mesh(seabedGeo, seabedMat);
    seabed.rotation.x = -Math.PI / 2.8;
    seabed.position.set(0, -130, -50);
    seabed.receiveShadow = true;
    scene.add(seabed);

    // 泡
    const bubbles = [];
    const bubbleGeo = new THREE.SphereGeometry(2, 12, 12);
    const bubbleMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff, transparent: true, opacity: 0.6, roughness: 0.1, transmission: 0.9
    });

    for (let i = 0; i < 35; i++) {
      const mesh = new THREE.Mesh(bubbleGeo, bubbleMat);
      mesh.position.set((Math.random() - 0.5) * 400, (Math.random() - 0.5) * 300, (Math.random() - 0.5) * 150);
      const scale = Math.random() * 1.5 + 0.5;
      mesh.scale.set(scale, scale, scale);
      mesh.userData = { speedY: Math.random() * 0.4 + 0.2 };
      scene.add(mesh);
      bubbles.push(mesh);
    }

    const active3DFishes = [];
    const active3DFoods = [];

    document.body.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    });

    function show3DEatEffect(position, text) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
      ctx.roundRect(10, 20, 236, 88, 30);
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#ff4081";
      ctx.stroke();

      ctx.font = "Bold 26px sans-serif";
      ctx.fillStyle = "#ff4081";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 128, 64);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);

      sprite.position.copy(position);
      sprite.position.y += 20;
      sprite.scale.set(35, 17.5, 1);
      scene.add(sprite);

      const startTime = Date.now();
      const interval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        sprite.position.y += 0.3;
        sprite.material.opacity = 1 - (elapsed / 1400);

        if (elapsed >= 1400) {
          clearInterval(interval);
          scene.remove(sprite);
          sprite.material.dispose();
          texture.dispose();
        }
      }, 30);
    }

    // 💡【真・3D膨らましアルゴリズム】平らな絵の頂点を手前に押し出して「粘土フィギュア化」する！
    function create3DFish(dataURL, type, callback) {
      const loader = new THREE.TextureLoader();
      loader.load(dataURL, (texture) => {
        texture.colorSpace = THREE.SRGBColorSpace;

        const img = texture.image;
        const aspect = img.width / img.height;
        const width = 64;
        const height = width / aspect;

        // 1. 細かな3Dメッシュ（ポリゴン網）を作成 (32x32分割)
        const segs = 32;
        const geometry = new THREE.PlaneGeometry(width, height, segs, segs);

        // 2. 画像のアルファチャンネル（塗りの深さ）を解析
        const canvas = document.createElement('canvas');
        canvas.width = segs + 1;
        canvas.height = segs + 1;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, segs + 1, segs + 1);
        const imgData = ctx.getImageData(0, 0, segs + 1, segs + 1).data;

        // 3. 各ポリゴン頂点のZ座標（高さ）を変形させて「ぷっくり」膨らませる
        const pos = geometry.attributes.position;
        for (let y = 0; y <= segs; y++) {
          for (let x = 0; x <= segs; x++) {
            const idx = (y * (segs + 1) + x);
            const alpha = imgData[idx * 4 + 3]; // 透明度

            if (alpha > 30) {
              // 端っこ（輪郭）は低く、中心に近いほど手前（Z軸）へ丸く膨らませる！
              const nx = (x / segs) - 0.5;
              const ny = (y / segs) - 0.5;
              const centerDist = Math.cos(nx * Math.PI) * Math.cos(ny * Math.PI);
              
              // 手前に12px押し出す
              pos.setZ(idx, Math.pow(centerDist, 0.7) * 14 * (alpha / 255));
            } else {
              pos.setZ(idx, 0);
            }
          }
        }
        geometry.computeVertexNormals(); // 陰影計算を更新

        // 4. マテリアル設定（ツヤと立体感のある質感）
        const material = new THREE.MeshStandardMaterial({
          map: texture,
          transparent: true,
          alphaTest: 0.1,
          side: THREE.DoubleSide,
          roughness: 0.25,
          metalness: 0.1
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        callback(mesh);
      });
    }

    // Firebase: 受信処理
    onChildAdded(ref(db, 'art_stream'), (snapshot) => {
      const data = snapshot.val();
      if (!data || !data.dataURL) return;

      const now = Date.now();
      const createdAt = data.createdAt || now;
      const elapsedTime = now - createdAt;

      if (elapsedTime >= MAX_LIFETIME) {
        remove(snapshot.ref).catch(() => {});
        return;
      }

      const remainingLife = MAX_LIFETIME - elapsedTime;
      const type = data.type || 'fish';

      create3DFish(data.dataURL, type, (fishMesh) => {
        const startY = (type === 'crab') ? -100 : (Math.random() - 0.5) * 120;
        fishMesh.position.set((Math.random() - 0.5) * 240, startY, (Math.random() - 0.5) * 60);

        fishMesh.userData = {
          type: type,
          targetPos: fishMesh.position.clone(),
          speed: type === 'crab' ? 0.6 : 0.9,
          eatenCount: 0,
          maxEatCount: 5,
          isFull: false,
          isLeaving: false,
          targetFood: null,
          dbRef: snapshot.ref,
          baseScale: 1.0,
          swimTimeOffset: Math.random() * 100,
          currentAngleY: 0
        };

        scene.add(fishMesh);
        active3DFishes.push(fishMesh);

        setTimeout(() => {
          fishMesh.userData.isLeaving = true;
          if (snapshot.ref) remove(snapshot.ref).catch(() => {});
        }, remainingLife);
      });
    });

    // Firebase: エサ受信
    onChildAdded(ref(db, 'feed_stream'), (snapshot) => {
      if (processedFoodKeys.has(snapshot.key)) return;
      processedFoodKeys.add(snapshot.key);

      const data = snapshot.val();
      if (!data || typeof data.createdAt !== 'number') {
        remove(snapshot.ref).catch(() => {});
        return;
      }

      const now = Date.now();
      if (data.createdAt < pageStartTime - 1000 || (now - data.createdAt) > 10000) {
        remove(snapshot.ref).catch(() => {});
        return;
      }

      drop3DFood();
      remove(snapshot.ref).catch(() => {});
    });

    function drop3DFood() {
      const foodGeo = new THREE.SphereGeometry(6, 16, 16);
      const foodMat = new THREE.MeshStandardMaterial({ color: 0x8d6e63, roughness: 0.5 });
      const foodMesh = new THREE.Mesh(foodGeo, foodMat);
      foodMesh.castShadow = true;

      const startX = (Math.random() - 0.5) * 220;
      foodMesh.position.set(startX, 150, (Math.random() - 0.5) * 40);

      foodMesh.userData = { isEaten: false, targetedBy: null, fallSpeed: 0.6 };

      scene.add(foodMesh);
      active3DFoods.push(foodMesh);
    }

    function remove3DFood(foodMesh) {
      foodMesh.userData.isEaten = true;
      const idx = active3DFoods.indexOf(foodMesh);
      if (idx !== -1) active3DFoods.splice(idx, 1);
      scene.remove(foodMesh);
      foodMesh.geometry.dispose();
      foodMesh.material.dispose();
    }

    // --- メインアニメーション ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // 泡
      bubbles.forEach(b => {
        b.position.y += b.userData.speedY;
        b.position.x += Math.sin(time + b.position.y) * 0.2;
        if (b.position.y > 160) b.position.y = -150;
      });

      // エサ
      active3DFoods.forEach(food => {
        if (food.userData.isEaten) return;
        food.position.y -= food.userData.fallSpeed;
        food.rotation.x += 0.02;
        food.rotation.y += 0.02;
        if (food.position.y < -110) remove3DFood(food);
      });

      // 3D魚たちの動的アニメーション
      active3DFishes.forEach(fish => {
        const data = fish.userData;

        if (data.isLeaving) {
          fish.position.y += 2.5;
          fish.position.x += 1.5;
          fish.rotation.y += 0.1;
          if (fish.position.y > 300) {
            scene.remove(fish);
            const idx = active3DFishes.indexOf(fish);
            if (idx !== -1) active3DFishes.splice(idx, 1);
          }
          return;
        }

        // A. エサ探索
        if (!data.targetFood && !data.isFull && active3DFoods.length > 0) {
          let closestFood = null;
          let minDist = Infinity;

          active3DFoods.forEach(food => {
            if (food.userData.isEaten) return;
            if (food.userData.targetedBy && food.userData.targetedBy !== fish) return;

            const dist = fish.position.distanceTo(food.position);
            if (dist < minDist) {
              minDist = dist;
              closestFood = food;
            }
          });

          if (closestFood) {
            data.targetFood = closestFood;
            closestFood.userData.targetedBy = fish;
          }
        }

        // B. 目標設定
        if (data.targetFood) {
          if (data.targetFood.userData.isEaten) {
            data.targetFood = null;
          } else {
            data.targetPos.copy(data.targetFood.position);
          }
        } else if (Math.random() < 0.015) {
          const targetY = (data.type === 'crab') ? -100 : (Math.random() - 0.5) * 180;
          data.targetPos.set(
            (Math.random() - 0.5) * 240,
            targetY,
            (Math.random() - 0.5) * 60
          );
        }

        // C. 3D移動＆ダイナミック旋回（厚みがしっかり見える動き）
        const dir = new THREE.Vector3().subVectors(data.targetPos, fish.position);
        const dist = dir.length();

        if (dist > 2) {
          dir.normalize();
          fish.position.addScaledVector(dir, data.speed * (data.targetFood ? 1.8 : 1.0));

          // 進行方向（Y軸）の回転
          const targetAngleY = dir.x > 0 ? 0.3 : Math.PI - 0.3; // 完全に真横でなく少し斜めにして厚みを見せる
          data.currentAngleY = THREE.MathUtils.lerp(data.currentAngleY, targetAngleY, 0.08);
          fish.rotation.y = data.currentAngleY;

          // 💡3D感を強調する体全体のひねり（Z軸・X軸回転）
          fish.rotation.z = Math.sin(time * 3 + data.swimTimeOffset) * 0.15;
          fish.rotation.x = dir.y * 0.3;
        }

        // D. 食いつき判定
        if (data.targetFood) {
          const hitDist = fish.position.distanceTo(data.targetFood.position);
          if (hitDist < 25) {
            const eatenFood = data.targetFood;
            data.targetFood = null;
            remove3DFood(eatenFood);

            data.eatenCount++;
            data.baseScale += 0.12;
            fish.scale.setScalar(data.baseScale);

            if (data.eatenCount >= data.maxEatCount) {
              data.isFull = true;
              show3DEatEffect(fish.position, "🈵 おなかいっぱい！💤");
            } else {
              const msgs = ["❤️ ぱくっ！", "✨ モグモグ！", "😋 おいしい！", "🎵 もぐもぐ！"];
              const msg = msgs[Math.floor(Math.random() * msgs.length)];
              show3DEatEffect(fish.position, msg);
            }
          }
        }
      });

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
