<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>みんなの水族館 - 3D Ultra Edition</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="みんなの水族館">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    html, body { 
      margin: 0; padding: 0;
      overflow: hidden; 
      width: 100vw; height: 100vh; height: 100dvh;
      background: linear-gradient(180deg, #0288d1 0%, #01579b 55%, #002f6c 100%);
      position: relative; font-family: sans-serif;
      overscroll-behavior: none; user-select: none;
    }

    #webgl-container {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    /* 水面の光の差し込み効果 */
    .sunbeams {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(
        110deg,
        rgba(255, 255, 255, 0.15) 0px,
        rgba(255, 255, 255, 0.15) 40px,
        transparent 40px,
        transparent 110px
      );
      pointer-events: none; z-index: 2;
    }
  </style>
</head>
<body>

  <div class="sunbeams"></div>
  <div id="webgl-container"></div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // --- Firebase 設定 ---
    const firebaseConfig = {
      apiKey: "AIzaSyC0FLLOsSAd3fYvI1OI1KSUARostoV5HVM",
      authDomain: "espu9owen.firebaseapp.com",
      databaseURL: "https://espu9owen-default-rtdb.firebaseio.com",
      projectId: "espu9owen",
      storageBucket: "espu9owen.firebasestorage.app",
      messagingSenderId: "1003969526788",
      appId: "1:1003969526788:web:00a61b5a0cc2281de54951",
      measurementId: "G-GLW0L4Y53H"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const processedFoodKeys = new Set();
    const pageStartTime = Date.now();
    const MAX_LIFETIME = 120000;

    // --- Three.js 基本セットアップ ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 2000);
    camera.position.set(0, 0, 320);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- ライティング（水中のライティング） ---
    const ambientLight = new THREE.AmbientLight(0xdff0ff, 0.9);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
    mainLight.position.set(80, 250, 200);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 1024;
    mainLight.shadow.mapSize.height = 1024;
    scene.add(mainLight);

    const pointLight = new THREE.PointLight(0x29b6f6, 1.2, 500);
    pointLight.position.set(0, -100, 100);
    scene.add(pointLight);

    // --- 水底（砂地）の3D作成 ---
    const seabedGeo = new THREE.PlaneGeometry(800, 300, 32, 32);
    const seabedMat = new THREE.MeshStandardMaterial({
      color: 0xffe082,
      roughness: 0.9,
      metalness: 0.1
    });
    const seabed = new THREE.Mesh(seabedGeo, seabedMat);
    seabed.rotation.x = -Math.PI / 3.5;
    seabed.position.set(0, -140, -50);
    seabed.receiveShadow = true;
    scene.add(seabed);

    // --- 泡（Bubbles）パーティクル ---
    const bubbleCount = 40;
    const bubbleGeo = new THREE.SphereGeometry(2, 12, 12);
    const bubbleMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.6,
      roughness: 0.1,
      transmission: 0.9,
      thickness: 1
    });

    const bubbles = [];
    for (let i = 0; i < bubbleCount; i++) {
      const mesh = new THREE.Mesh(bubbleGeo, bubbleMat);
      mesh.position.set(
        (Math.random() - 0.5) * 400,
        (Math.random() - 0.5) * 300,
        (Math.random() - 0.5) * 150
      );
      const scale = Math.random() * 1.5 + 0.5;
      mesh.scale.set(scale, scale, scale);
      mesh.userData = { speedY: Math.random() * 0.4 + 0.2 };
      scene.add(mesh);
      bubbles.push(mesh);
    }

    // --- 配列管理 ---
    const active3DFishes = [];
    const active3DFoods = [];

    // --- ダブルクリックでフルスクリーン切り替え ---
    document.body.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    });

    // --- 3D吹き出し（「ぱくっ！」メッセージ）生成 ---
    function show3DEatEffect(position, text) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
      ctx.roundRect(10, 20, 236, 88, 30);
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#ff4081";
      ctx.stroke();

      ctx.font = "Bold 26px sans-serif";
      ctx.fillStyle = "#ff4081";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 128, 64);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);

      sprite.position.copy(position);
      sprite.position.y += 20;
      sprite.scale.set(35, 17.5, 1);
      scene.add(sprite);

      const startTime = Date.now();
      const interval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        sprite.position.y += 0.3;
        sprite.material.opacity = 1 - (elapsed / 1400);

        if (elapsed >= 1400) {
          clearInterval(interval);
          scene.remove(sprite);
          sprite.material.dispose();
          texture.dispose();
        }
      }, 30);
    }

    // --- 2Dイラストから「厚みのある3Dモデル（Extrude）」を作成 ---
    function create3DFish(dataURL, type, callback) {
      const img = new Image();
      img.crossOrigin = "Anonymous";
      img.src = dataURL;

      img.onload = () => {
        const aspect = img.width / img.height;
        const baseW = 60;
        const baseH = baseW / aspect;

        // 立体化（押し出しパス）の作成
        const shape = new THREE.Shape();
        shape.moveTo(-baseW / 2, -baseH / 2);
        shape.lineTo(baseW / 2, -baseH / 2);
        shape.lineTo(baseW / 2, baseH / 2);
        shape.lineTo(-baseW / 2, baseH / 2);
        shape.closePath();

        const extrudeSettings = {
          depth: 10,           // 厚み
          bevelEnabled: true,  // 角を丸める
          bevelSegments: 4,
          steps: 1,
          bevelSize: 2,
          bevelThickness: 2
        };

        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geometry.center();

        const texture = new THREE.Texture(img);
        texture.needsUpdate = true;
        texture.colorSpace = THREE.SRGBColorSpace;

        // 前面・背面に描いたイラスト、側面に鮮やかな水色マテリアルを配置
        const frontMaterial = new THREE.MeshStandardMaterial({
          map: texture,
          transparent: true,
          alphaTest: 0.1,
          roughness: 0.3,
          metalness: 0.1
        });

        const sideMaterial = new THREE.MeshStandardMaterial({
          color: 0x29b6f6,
          roughness: 0.4,
          metalness: 0.2
        });

        const mesh = new THREE.Mesh(geometry, [frontMaterial, sideMaterial]);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        callback(mesh);
      };
    }

    // --- Firebase: 魚の受信処理 ---
    onChildAdded(ref(db, 'art_stream'), (snapshot) => {
      const data = snapshot.val();
      if (!data || !data.dataURL) return;

      const now = Date.now();
      const createdAt = data.createdAt || now;
      const elapsedTime = now - createdAt;

      if (elapsedTime >= MAX_LIFETIME) {
        remove(snapshot.ref).catch(() => {});
        return;
      }

      const remainingLife = MAX_LIFETIME - elapsedTime;
      const type = data.type || 'fish';

      create3DFish(data.dataURL, type, (fishMesh) => {
        const startY = (type === 'crab') ? -110 : (Math.random() - 0.5) * 120;
        fishMesh.position.set((Math.random() - 0.5) * 260, startY, (Math.random() - 0.5) * 60);

        fishMesh.userData = {
          type: type,
          targetPos: fishMesh.position.clone(),
          speed: type === 'crab' ? 0.6 : 0.9,
          eatenCount: 0,
          maxEatCount: 5,
          isFull: false,
          isLeaving: false,
          targetFood: null,
          dbRef: snapshot.ref,
          baseScale: 1.0,
          swimTimeOffset: Math.random() * 100
        };

        scene.add(fishMesh);
        active3DFishes.push(fishMesh);

        // 寿命が来たら飛んで消えるアニメーション
        setTimeout(() => {
          fishMesh.userData.isLeaving = true;
          if (snapshot.ref) remove(snapshot.ref).catch(() => {});
        }, remainingLife);
      });
    });

    // --- Firebase: エサの受信処理（重複ストッパー付き） ---
    onChildAdded(ref(db, 'feed_stream'), (snapshot) => {
      if (processedFoodKeys.has(snapshot.key)) return;
      processedFoodKeys.add(snapshot.key);

      const data = snapshot.val();
      if (!data || typeof data.createdAt !== 'number') {
        remove(snapshot.ref).catch(() => {});
        return;
      }

      const now = Date.now();
      if (data.createdAt < pageStartTime - 1000 || (now - data.createdAt) > 10000) {
        remove(snapshot.ref).catch(() => {});
        return;
      }

      drop3DFood();
      remove(snapshot.ref).catch(() => {});
    });

    // --- 3Dエサの落下 ---
    function drop3DFood() {
      const foodGeo = new THREE.SphereGeometry(6, 16, 16);
      const foodMat = new THREE.MeshStandardMaterial({
        color: 0x8d6e63,
        roughness: 0.6,
        metalness: 0.1
      });

      const foodMesh = new THREE.Mesh(foodGeo, foodMat);
      foodMesh.castShadow = true;

      const startX = (Math.random() - 0.5) * 240;
      foodMesh.position.set(startX, 150, (Math.random() - 0.5) * 40);

      foodMesh.userData = {
        isEaten: false,
        targetedBy: null,
        fallSpeed: 0.6
      };

      scene.add(foodMesh);
      active3DFoods.push(foodMesh);
    }

    function remove3DFood(foodMesh) {
      foodMesh.userData.isEaten = true;
      const idx = active3DFoods.indexOf(foodMesh);
      if (idx !== -1) active3DFoods.splice(idx, 1);
      scene.remove(foodMesh);
      foodMesh.geometry.dispose();
      foodMesh.material.dispose();
    }

    // --- メインアニメーションループ（AI＆移動制御） ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // 1. 泡の上下運動
      bubbles.forEach(b => {
        b.position.y += b.userData.speedY;
        b.position.x += Math.sin(time + b.position.y) * 0.2;
        if (b.position.y > 160) b.position.y = -150;
      });

      // 2. 3Dエサの落下制御
      active3DFoods.forEach(food => {
        if (food.userData.isEaten) return;
        food.position.y -= food.userData.fallSpeed;
        food.rotation.x += 0.02;
        food.rotation.y += 0.02;

        if (food.position.y < -120) {
          remove3DFood(food);
        }
      });

      // 3. 3D魚たちのAI＆リアルスイミング処理
      active3DFishes.forEach(fish => {
        const data = fish.userData;

        // 退出アニメーション（くるくる回りながら空へ）
        if (data.isLeaving) {
          fish.position.y += 2.5;
          fish.position.x += 1.5;
          fish.rotation.y += 0.1;
          fish.rotation.z += 0.1;
          if (fish.position.y > 300) {
            scene.remove(fish);
            const idx = active3DFishes.indexOf(fish);
            if (idx !== -1) active3DFishes.splice(idx, 1);
          }
          return;
        }

        // A. エサのターゲット探索
        if (!data.targetFood && !data.isFull && active3DFoods.length > 0) {
          let closestFood = null;
          let minDist = Infinity;

          active3DFoods.forEach(food => {
            if (food.userData.isEaten) return;
            if (food.userData.targetedBy && food.userData.targetedBy !== fish) return;

            const dist = fish.position.distanceTo(food.position);
            if (dist < minDist) {
              minDist = dist;
              closestFood = food;
            }
          });

          if (closestFood) {
            data.targetFood = closestFood;
            closestFood.userData.targetedBy = fish;
          }
        }

        // B. 目標位置の更新
        if (data.targetFood) {
          if (data.targetFood.userData.isEaten) {
            data.targetFood = null;
          } else {
            data.targetPos.copy(data.targetFood.position);
          }
        } else if (Math.random() < 0.015) { // ランダム回遊
          const targetY = (data.type === 'crab') ? -110 : (Math.random() - 0.5) * 200;
          data.targetPos.set(
            (Math.random() - 0.5) * 260,
            targetY,
            (Math.random() - 0.5) * 60
          );
        }

        // C. 目標地点へ移動
        const dir = new THREE.Vector3().subVectors(data.targetPos, fish.position);
        const dist = dir.length();

        if (dist > 2) {
          dir.normalize();
          fish.position.addScaledVector(dir, data.speed * (data.targetFood ? 1.8 : 1.0));

          // 魚の進行方向（Y軸回転）の制御
          const targetAngleY = dir.x > 0 ? 0 : Math.PI;
          fish.rotation.y = THREE.MathUtils.lerp(fish.rotation.y, targetAngleY, 0.1);
        }

        // D. 泳ぎのゆらぎ（Z軸の波打ちアニメーション）
        if (data.type !== 'crab') {
          fish.rotation.z = Math.sin(time * 3 + data.swimTimeOffset) * 0.12;
          fish.position.y += Math.sin(time * 2 + data.swimTimeOffset) * 0.1;
        }

        // E. エサへのヒット（パクッと食べる判定）
        if (data.targetFood) {
          const hitDist = fish.position.distanceTo(data.targetFood.position);
          if (hitDist < 25) {
            const eatenFood = data.targetFood;
            data.targetFood = null;
            remove3DFood(eatenFood);

            data.eatenCount++;
            data.baseScale += 0.12;
            fish.scale.setScalar(data.baseScale);

            if (data.eatenCount >= data.maxEatCount) {
              data.isFull = true;
              show3DEatEffect(fish.position, "🈵 おなかいっぱい！💤");
            } else {
              const msgs = ["❤️ ぱくっ！", "✨ モグモグ！", "😋 おいしい！", "🎵 もぐもぐ！"];
              const msg = msgs[Math.floor(Math.random() * msgs.length)];
              show3DEatEffect(fish.position, msg);
            }
          }
        }
      });

      renderer.render(scene, camera);
    }

    animate();

    // --- ウィンドウリサイズ対応 ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
