<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>じゆうにお絵描きターミナル</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    :root {
      --primary-color: #00bcd4;
      --bg-color: #e0f7fa;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100dvh;
      overflow: hidden;
      touch-action: none;
      background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
      font-family: "M PLUS Rounded 1c", sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      user-select: none;
    }

    /* ヘッダーエリア */
    .header-bar {
      width: 100%; padding: 8px 16px;
      display: flex; align-items: center; justify-content: space-between;
      box-sizing: border-box;
    }

    .title {
      font-size: min(1.2rem, 4vw); font-weight: bold; color: #006064;
      display: flex; align-items: center; gap: 6px;
    }

    .type-selector {
      display: flex; gap: 6px; background: rgba(255,255,255,0.8);
      padding: 4px; border-radius: 20px; border: 2px solid #80deea;
    }

    .type-btn {
      border: none; background: transparent; padding: 4px 10px;
      border-radius: 16px; font-size: 0.85rem; font-weight: bold;
      color: #00838f; cursor: pointer; transition: all 0.2s;
    }

    .type-btn.active { background: #00acc1; color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

    /* メインキャンバスエリア */
    .canvas-container {
      position: relative; flex: 1; width: 94vw; max-width: 800px;
      margin: 4px 0; display: flex; align-items: center; justify-content: center;
    }

    canvas {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 96, 100, 0.15);
      border: 4px solid #ffffff;
      touch-action: none;
    }

    /* カーソル指定 */
    canvas.cursor-pen { cursor: crosshair; }
    canvas.cursor-eraser { cursor: cell; }
    /* ★ 1. 塗りつぶし時のペイントバケツカーソル */
    canvas.cursor-bucket {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="%2300acc1" stroke="%23ffffff" stroke-width="2"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><circle cx="20" cy="18" r="3" fill="%23ff4081"/></svg>') 4 28, pointer;
    }

    /* ツールバーエリア */
    .toolbar {
      width: 96vw; max-width: 820px; background: rgba(255,255,255,0.92);
      border-radius: 24px 24px 0 0; padding: 10px 12px min(20px, 3vh);
      box-shadow: 0 -4px 20px rgba(0,60,64,0.1);
      display: flex; flex-direction: column; gap: 10px;
      box-sizing: border-box;
    }

    .tool-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }

    /* ツールボタン群 */
    .btn-group { display: flex; gap: 6px; }

    .tool-btn {
      padding: 8px 12px; border-radius: 16px; border: 2px solid #b2ebf2;
      background: #fff; font-size: min(0.9rem, 3.2vw); font-weight: bold; color: #00838f;
      display: flex; align-items: center; gap: 4px; cursor: pointer; transition: all 0.15s;
    }

    .tool-btn:active { transform: scale(0.92); }
    .tool-btn.active { background: #00acc1; color: #fff; border-color: #00acc1; }
    .tool-btn:disabled { opacity: 0.35; pointer-events: none; }

    /* カラーパレット */
    .color-palette { display: flex; gap: 6px; overflow-x: auto; padding: 2px; }
    .color-dot {
      width: 32px; height: 32px; border-radius: 50%; border: 3px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2); cursor: pointer; flex-shrink: 0;
      transition: transform 0.15s;
    }
    .color-dot.active { transform: scale(1.25); border-color: #00838f; }

    /* 送信ボタン */
    .send-btn {
      background: linear-gradient(135deg, #ff7043, #f4511e); color: #fff;
      border: none; padding: 10px 20px; border-radius: 20px;
      font-size: 1rem; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 12px rgba(244, 81, 30, 0.3);
      display: flex; align-items: center; gap: 6px;
    }
    .send-btn:active { transform: scale(0.95); }

    /* お知らせトースト */
    .toast {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: rgba(0, 96, 100, 0.9); color: #fff; padding: 8px 18px;
      border-radius: 20px; font-size: 0.85rem; font-weight: bold;
      pointer-events: none; opacity: 0; transition: all 0.3s; z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="toast" id="toast">✏️ 自動でペンに戻ったよ！</div>

  <div class="header-bar">
    <div class="title">🎨 おえかきターミナル</div>
    <div class="type-selector">
      <button class="type-btn active" data-type="fish">🐟 さかな</button>
      <button class="type-btn" data-type="crab">🦀 カニ</button>
      <button class="type-btn" data-type="octopus">🐙 タコ</button>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="paintCanvas" class="cursor-pen"></canvas>
  </div>

  <div class="toolbar">
    <div class="tool-row">
      <div class="btn-group">
        <!-- ツールボタン -->
        <button class="tool-btn active" id="btnPen">✏️ ペン</button>
        <!-- ★ 4. 消しゴムボタン -->
        <button class="tool-btn" id="btnEraser">🧹 けしごむ</button>
        <!-- ★ 1. 塗りつぶしボタン -->
        <button class="tool-btn" id="btnBucket">🪣 ぬりつぶし</button>
      </div>

      <div class="btn-group">
        <!-- ★ 3. 一つ前に戻すボタン -->
        <button class="tool-btn" id="btnUndo" disabled>↩️ もどす</button>
        <button class="tool-btn" id="btnClear">🗑️ けす</button>
      </div>
    </div>

    <div class="tool-row">
      <!-- カラーパレット -->
      <div class="color-palette" id="colorPalette"></div>

      <!-- 送信ボタン -->
      <button class="send-btn" id="btnSend">🚀 すいぞくかんへ！</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC0FLLOsSAd3fYvI1OI1KSUARostoV5HVM",
      authDomain: "espu9owen.firebaseapp.com",
      databaseURL: "https://espu9owen-default-rtdb.firebaseio.com",
      projectId: "espu9owen",
      storageBucket: "espu9owen.firebasestorage.app",
      messagingSenderId: "1003969526788",
      appId: "1:1003969526788:web:00a61b5a0cc2281de54951",
      measurementId: "G-GLW0L4Y53H"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const toast = document.getElementById('toast');

    // 状態管理
    let currentMode = 'pen'; // 'pen', 'eraser', 'bucket'
    let currentColor = '#ff2a6d';
    let currentType = 'fish';
    let isDrawing = false;
    let lastX = 0, lastY = 0;

    // ★ 3. Undo用 履歴スタック
    const historyStack = [];
    const MAX_HISTORY = 15;

    // パレット用のカラー
    const COLORS = [
      '#ff2a6d', '#ff7043', '#ffca28', '#66bb6a', 
      '#29b6f6', '#ab47bc', '#8d6e63', '#212121'
    ];

    // キャンバスリサイズ設定
    function resizeCanvas() {
      const container = canvas.parentElement;
      const rect = container.getBoundingClientRect();
      
      // 一時保存
      const tempImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
      
      canvas.width = rect.width - 8;
      canvas.height = Math.min(rect.width * 0.75, window.innerHeight * 0.55);
      
      // 初期背景（透明）
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      if (tempImage.width > 0) {
        ctx.putImageData(tempImage, 0, 0);
      }
    }

    window.addEventListener('resize', resizeCanvas);

    // ★ 3. 状態保存（Undo用）
    function saveHistory() {
      if (historyStack.length >= MAX_HISTORY) {
        historyStack.shift();
      }
      historyStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      document.getElementById('btnUndo').disabled = false;
    }

    // ★ 3. 一つ前に戻す実行
    function undo() {
      if (historyStack.length > 0) {
        const previousState = historyStack.pop();
        ctx.putImageData(previousState, 0, 0);
        if (historyStack.length === 0) {
          document.getElementById('btnUndo').disabled = true;
        }
      }
    }

    // モード切替処理（★ 1. カーソル変更込み）
    function setMode(mode) {
      currentMode = mode;
      
      document.getElementById('btnPen').classList.toggle('active', mode === 'pen');
      document.getElementById('btnEraser').classList.toggle('active', mode === 'eraser');
      document.getElementById('btnBucket').classList.toggle('active', mode === 'bucket');

      canvas.className = '';
      if (mode === 'pen') canvas.classList.add('cursor-pen');
      if (mode === 'eraser') canvas.classList.add('cursor-eraser');
      if (mode === 'bucket') canvas.classList.add('cursor-bucket'); // ★ ペンキマーク
    }

    // トースト表示
    function showToast(text) {
      toast.innerText = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // カラーパレット作成
    const paletteContainer = document.getElementById('colorPalette');
    COLORS.forEach((color, idx) => {
      const dot = document.createElement('div');
      dot.className = `color-dot ${idx === 0 ? 'active' : ''}`;
      dot.style.backgroundColor = color;
      dot.addEventListener('click', () => {
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        currentColor = color;
        if (currentMode === 'eraser') setMode('pen'); // 色を選んだらペンへ
      });
      paletteContainer.appendChild(dot);
    });

    // 生物タイプ選択
    document.querySelectorAll('.type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentType = btn.dataset.type;
      });
    });

    // 描画イベント handlers
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: Math.round((clientX - rect.left) * (canvas.width / rect.width)),
        y: Math.round((clientY - rect.top) * (canvas.height / rect.height))
      };
    }

    // ★ 1＆2. バケツ塗りつぶし（Flood Fill）アルゴリズム
    function floodFill(startX, startY, fillColorHex) {
      saveHistory();

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const width = canvas.width;
      const height = canvas.height;

      // HexカラーをRGBAへ変換
      const r = parseInt(fillColorHex.slice(1, 3), 16);
      const g = parseInt(fillColorHex.slice(3, 5), 16);
      const b = parseInt(fillColorHex.slice(5, 7), 16);
      const a = 255;

      const targetIdx = (startY * width + startX) * 4;
      const startR = data[targetIdx];
      const startG = data[targetIdx + 1];
      const startB = data[targetIdx + 2];
      const startA = data[targetIdx + 3];

      // 同じ色なら塗りつぶさない
      if (startR === r && startG === g && startB === b && startA === a) return;

      const queue = [[startX, startY]];
      const matchColor = (idx) => {
        return Math.abs(data[idx] - startR) < 30 &&
               Math.abs(data[idx+1] - startG) < 30 &&
               Math.abs(data[idx+2] - startB) < 30 &&
               Math.abs(data[idx+3] - startA) < 30;
      };

      while (queue.length > 0) {
        const [x, y] = queue.pop();
        const idx = (y * width + x) * 4;

        if (x < 0 || x >= width || y < 0 || y >= height) continue;

        if (matchColor(idx)) {
          data[idx] = r;
          data[idx + 1] = g;
          data[idx + 2] = b;
          data[idx + 3] = a;

          queue.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
      }

      ctx.putImageData(imgData, 0, 0);

      // ★ 2. 塗りつぶしたら「自動でペンに戻る」神機能！
      setMode('pen');
      showToast('✏️ 自動でペンに戻ったよ！');
    }

    // タッチ＆マウス開始
    function startDraw(e) {
      const { x, y } = getPos(e);

      if (currentMode === 'bucket') {
        floodFill(x, y, currentColor);
        return;
      }

      saveHistory(); // 描画開始前に履歴保持
      isDrawing = true;
      lastX = x;
      lastY = y;
    }

    // 描画中
    function draw(e) {
      if (!isDrawing) return;
      const { x, y } = getPos(e);

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(x, y);

      if (currentMode === 'eraser') {
        // ★ 4. 消しゴム（透過消去）
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = 24;
      } else {
        // ペン
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 8;
      }

      ctx.stroke();
      lastX = x;
      lastY = y;
    }

    function stopDraw() {
      isDrawing = false;
    }

    // イベント登録
    canvas.addEventListener('pointerdown', startDraw);
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', stopDraw);
    canvas.addEventListener('pointerleave', stopDraw);

    // ボタンイベント
    document.getElementById('btnPen').addEventListener('click', () => setMode('pen'));
    document.getElementById('btnEraser').addEventListener('click', () => setMode('eraser'));
    document.getElementById('btnBucket').addEventListener('click', () => setMode('bucket'));
    document.getElementById('btnUndo').addEventListener('click', undo);

    document.getElementById('btnClear').addEventListener('click', () => {
      saveHistory();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    // Firebaseへ送信
    document.getElementById('btnSend').addEventListener('click', () => {
      const dataURL = canvas.toDataURL('image/png');
      
      // 空白チェック
      const blank = document.createElement('canvas');
      blank.width = canvas.width;
      blank.height = canvas.height;
      if (canvas.toDataURL() === blank.toDataURL()) {
        alert("絵を描いてから送ってね！");
        return;
      }

      push(ref(db, 'art_stream'), {
        dataURL: dataURL,
        type: currentType,
        createdAt: Date.now()
      }).then(() => {
        showToast('🎉 すいぞくかんへ 送ったよ！');
        saveHistory();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }).catch(err => {
        alert("送信権限エラーです。");
      });
    });

    // 初期化実行
    resizeCanvas();
    setMode('pen');
  </script>
</body>
</html>
