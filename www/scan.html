<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>お絵描きスキャナー - スマート輪郭抽出版</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100dvh;
      overflow: hidden; touch-action: none;
      background-color: #222; font-family: sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      color: #fff;
    }

    .header {
      padding: 10px; font-size: 1.1rem; font-weight: bold;
      text-align: center; background: rgba(0,0,0,0.5); width: 100%; box-sizing: border-box;
    }

    .camera-container {
      position: relative; width: 90vw; height: 65dvh; max-width: 800px;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      background: #333;
    }

    video { width: 100%; height: 100%; object-fit: cover; }

    #previewCanvas {
      display: none; max-width: 90%; max-height: 90%; object-fit: contain;
      background-color: #fff;
      background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), 
                        linear-gradient(-45deg, #ccc 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #ccc 75%), 
                        linear-gradient(-45deg, transparent 75%, #ccc 75%);
      background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .guide-frame {
      position: absolute; width: 72vw; height: 72vw; max-width: 380px; max-height: 380px;
      border: 4px dashed #ff5252; border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); pointer-events: none;
      display: flex; justify-content: center; align-items: center; box-sizing: border-box;
    }

    .guide-text {
      background: rgba(255, 82, 82, 0.85); color: white; padding: 6px 14px;
      border-radius: 20px; font-size: 0.95rem; font-weight: bold;
    }

    .controls {
      padding: 15px; display: flex; gap: 15px; justify-content: center;
      width: 100%; background: rgba(0,0,0,0.5); box-sizing: border-box;
    }

    button {
      font-size: 1.1rem; padding: 12px 24px; border-radius: 30px; border: none;
      cursor: pointer; font-weight: bold; transition: 0.1s; outline: none;
    }
    button:active { transform: scale(0.95); }

    .btn-scan { background: #ff9800; color: #fff; font-size: 1.3rem; padding: 14px 32px; box-shadow: 0 4px 10px rgba(255,152,0,0.4); }
    .btn-send { background: #4caf50; color: #fff; display: none; font-size: 1.2rem; padding: 14px 28px; }
    .btn-retry { background: #757575; color: #fff; display: none; }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
      background: rgba(0,0,0,0.85); z-index: 100;
      flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    }

    .modal-title { font-size: 1.6rem; font-weight: bold; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    .modal-buttons { display: flex; flex-direction: column; gap: 15px; width: 80%; max-width: 320px; }

    .btn-choice {
      font-size: 1.4rem; padding: 16px; border-radius: 40px; border: none;
      color: #fff; font-weight: bold; cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.4);
    }
    .choice-fish { background: #2196f3; }
    .choice-crab { background: #ff9800; }
    .choice-octopus { background: #e91e63; }

    #loadingOverlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
      background: rgba(0,0,0,0.6); z-index: 200;
      flex-direction: column; align-items: center; justify-content: center;
    }
    
    .spinner-text {
      color: #fff; font-size: 1.5rem; font-weight: bold; margin-top: 15px;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    #processCanvas { display: none; }
  </style>
</head>
<body>

  <div class="header">しかくい赤枠の中にえを入れてね！</div>

  <div class="camera-container" id="cameraContainer">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="previewCanvas"></canvas>
    
    <div class="guide-frame" id="guideFrame">
      <span class="guide-text" id="guideText">ここに絵を入れてね</span>
    </div>
  </div>

  <div class="controls">
    <button id="btnScan" class="btn-scan" onclick="startCapture()">📷 スキャン！</button>
    <button id="btnRetry" class="btn-retry" onclick="resetScan()">🔄 とりなおす</button>
    <button id="btnSend" class="btn-send" onclick="openChoiceModal()">🚀 およがせる！</button>
  </div>

  <div class="modal-overlay" id="choiceModal">
    <div class="modal-title">どれを およがせる？</div>
    <div class="modal-buttons">
      <button class="btn-choice choice-fish" onclick="selectAndSend('fish')">🐟 さかな</button>
      <button class="btn-choice choice-crab" onclick="selectAndSend('crab')">🦀 カニ</button>
      <button class="btn-choice choice-octopus" onclick="selectAndSend('octopus')">🐙 たこ・くらげ</button>
    </div>
  </div>

  <div id="loadingOverlay">
    <div style="font-size: 4rem;">⏳</div>
    <div class="spinner-text" id="loadingText">スキャンしています...</div>
  </div>

  <canvas id="processCanvas"></canvas>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC0FLLOsSAd3fYvI1OI1KSUARostoV5HVM",
      authDomain: "espu9owen.firebaseapp.com",
      databaseURL: "https://espu9owen-default-rtdb.firebaseio.com",
      projectId: "espu9owen",
      storageBucket: "espu9owen.firebasestorage.app",
      messagingSenderId: "1003969526788",
      appId: "1:1003969526788:web:00a61b5a0cc2281de54951",
      measurementId: "G-GLW0L4Y53H"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const video = document.getElementById('video');
    const cameraContainer = document.getElementById('cameraContainer');
    const guideFrame = document.getElementById('guideFrame');
    const processCanvas = document.getElementById('processCanvas');
    const previewCanvas = document.getElementById('previewCanvas');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const ctx = processCanvas.getContext('2d', { willReadFrequently: true });
    
    let processedDataURL = null;

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("カメラが起動できませんでした。");
      }
    }
    initCamera();

    window.startCapture = function() {
      if (!video.videoWidth || !video.videoHeight) return;
      loadingText.innerText = "✨ スキャンしています...";
      loadingOverlay.style.display = 'flex';
      setTimeout(() => { processImage(); }, 50);
    };

    function processImage() {
      const containerRect = cameraContainer.getBoundingClientRect();
      const guideRect = guideFrame.getBoundingClientRect();

      const vWidth = video.videoWidth;
      const vHeight = video.videoHeight;
      const containerRatio = containerRect.width / containerRect.height;
      const videoRatio = vWidth / vHeight;

      let renderWidth, renderHeight, offsetX, offsetY;
      if (containerRatio > videoRatio) {
        renderWidth = containerRect.width;
        renderHeight = containerRect.width / videoRatio;
        offsetX = 0;
        offsetY = (renderHeight - containerRect.height) / 2;
      } else {
        renderWidth = containerRect.height * videoRatio;
        renderHeight = containerRect.height;
        offsetX = (renderWidth - containerRect.width) / 2;
        offsetY = 0;
      }

      const scale = vWidth / renderWidth;
      const guideLeft = guideRect.left - containerRect.left;
      const guideTop = guideRect.top - containerRect.top;

      const cropX = Math.floor((guideLeft + offsetX) * scale);
      const cropY = Math.floor((guideTop + offsetY) * scale);
      const cropW = Math.floor(guideRect.width * scale);
      const cropH = Math.floor(guideRect.height * scale);

      const rawCanvas = document.createElement('canvas');
      rawCanvas.width = vWidth;
      rawCanvas.height = vHeight;
      const rawCtx = rawCanvas.getContext('2d');
      rawCtx.drawImage(video, 0, 0);

      processCanvas.width = cropW;
      processCanvas.height = cropH;
      ctx.drawImage(rawCanvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      const imgData = ctx.getImageData(0, 0, cropW, cropH);
      const data = imgData.data;

      // 💡【ステップ1】紙のベース色（背景色）を取得（角のピクセルからサンプリング）
      const cornerR = (data[0] + data[(cropW - 1) * 4] + data[(cropH - 1) * cropW * 4]) / 3;
      const cornerG = (data[1] + data[(cropW - 1) * 4 + 1] + data[(cropH - 1) * cropW * 4 + 1]) / 3;
      const cornerB = (data[2] + data[(cropW - 1) * 4 + 2] + data[(cropH - 1) * cropW * 4 + 2]) / 3;

      // ピクセルが「紙の地（背景）」かどうかを判定する関数
      const isPaperBackground = (r, g, b) => {
        const diffR = Math.abs(r - cornerR);
        const diffG = Math.abs(g - cornerG);
        const diffB = Math.abs(b - cornerB);
        const brightness = (r + g + b) / 3;
        // 背景色とほとんど同じ、かつ十分に明るい場合は「外側の紙」とみなす
        return (diffR < 28 && diffG < 28 && diffB < 28 && brightness > 150);
      };

      // 💡【ステップ2】Flood Fill（ペイントバケツ塗りつぶし）で外側の余白だけを透過マーク(1)にする
      const visited = new Uint8Array(cropW * cropH);
      const queue = [0, cropW - 1, (cropH - 1) * cropW, cropW * cropH - 1]; // 4隅からスタート

      queue.forEach(idx => visited[idx] = 1);

      while (queue.length > 0) {
        const curr = queue.pop();
        const pIdx = curr * 4;

        if (isPaperBackground(data[pIdx], data[pIdx + 1], data[pIdx + 2])) {
          data[pIdx + 3] = 0; // 外側の紙なので透明にする！

          const x = curr % cropW;
          const y = Math.floor(curr / cropW);

          // 上下左右に広がる
          const neighbors = [];
          if (x > 0) neighbors.push(curr - 1);
          if (x < cropW - 1) neighbors.push(curr + 1);
          if (y > 0) neighbors.push(curr - cropW);
          if (y < cropH - 1) neighbors.push(curr + cropW);

          for (const n of neighbors) {
            if (!visited[n]) {
              visited[n] = 1;
              queue.push(n);
            }
          }
        }
      }

      // 💡【ステップ3】外側以外の「内側に残った部分」の処理
      let minX = cropW, maxX = 0, minY = cropH, maxY = 0;
      let hasContent = false;

      for (let y = 0; y < cropH; y++) {
        for (let x = 0; x < cropW; x++) {
          const idx = (y * cropW + x) * 4;
          
          if (data[idx + 3] !== 0) { // 壁（輪郭）または内側の領域
            // 内側の塗られていない紙（白地）は綺麗な純白(#FFFFFF)に補正！
            const r = data[idx], g = data[idx + 1], b = data[idx + 2];
            if (isPaperBackground(r, g, b)) {
              data[idx] = 255;
              data[idx + 1] = 255;
              data[idx + 2] = 255;
            }

            if (x < minX) minX = x; if (x > maxX) maxX = x;
            if (y < minY) minY = y; if (y > maxY) maxY = y;
            hasContent = true;
          }
        }
      }

      loadingOverlay.style.display = 'none';

      if (!hasContent || minX >= maxX || minY >= maxY) {
        alert("枠の中に絵が見つからなかったよ！もう一度試してみてね。");
        return;
      }

      // 切り抜き＆プレビュー生成
      const pad = 8;
      minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
      maxX = Math.min(cropW, maxX + pad); maxY = Math.min(cropH, maxY + pad);

      const srcW = maxX - minX, srcH = maxY - minY;
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = cropW; tempCanvas.height = cropH;
      tempCanvas.getContext('2d').putImageData(imgData, 0, 0);

      const targetSize = 500;
      previewCanvas.width = targetSize; previewCanvas.height = targetSize;

      const pCtx = previewCanvas.getContext('2d');
      pCtx.clearRect(0, 0, targetSize, targetSize);

      const fitScale = Math.min((targetSize - 20) / srcW, (targetSize - 20) / srcH);
      const destW = srcW * fitScale, destH = srcH * fitScale;
      const destX = (targetSize - destW) / 2, destY = (targetSize - destH) / 2;

      pCtx.drawImage(tempCanvas, minX, minY, srcW, srcH, destX, destY, destW, destH);
      processedDataURL = previewCanvas.toDataURL("image/png");

      video.style.display = 'none';
      document.getElementById('guideFrame').style.display = 'none';
      previewCanvas.style.display = 'block';

      document.getElementById('btnScan').style.display = 'none';
      document.getElementById('btnRetry').style.display = 'inline-block';
      document.getElementById('btnSend').style.display = 'inline-block';
    }

    window.resetScan = function() {
      video.style.display = 'block';
      document.getElementById('guideFrame').style.display = 'flex';
      previewCanvas.style.display = 'none';
      document.getElementById('choiceModal').style.display = 'none';

      document.getElementById('btnScan').style.display = 'inline-block';
      document.getElementById('btnRetry').style.display = 'none';
      document.getElementById('btnSend').style.display = 'none';
    };

    window.openChoiceModal = function() {
      if (!processedDataURL) return;
      document.getElementById('choiceModal').style.display = 'flex';
    };

    window.selectAndSend = function(type) {
      document.getElementById('choiceModal').style.display = 'none';
      loadingText.innerText = "🚀 すいぞくかんへ おくっているよ...";
      loadingOverlay.style.display = 'flex';

      push(ref(db, 'art_stream'), { 
        dataURL: processedDataURL, 
        type: type,
        createdAt: Date.now() 
      }).then(() => {
        loadingOverlay.style.display = 'none';
        alert("すいぞくかんにおくったよ！");
        resetScan();
      }).catch((err) => {
        console.error(err);
        loadingOverlay.style.display = 'none';
        alert("エラーがおきたよ: " + (err.message || "送信失敗"));
      });
    };
  </script>
</body>
</html>
