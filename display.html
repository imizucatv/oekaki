<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>みんなの水族館</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="みんなの水族館">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#e1f5fe">

  <style>
    html, body { 
      margin: 0; padding: 0;
      overflow: hidden; 
      height: 100vh; height: 100dvh; width: 100vw;
      background: linear-gradient(180deg, #e1f5fe 0%, #b3e5fc 50%, #4fc3f7 100%);
      position: relative; font-family: sans-serif;
      overscroll-behavior: none; user-select: none;
    }

    .sunbeams {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(
        110deg,
        rgba(255, 255, 255, 0.25) 0px,
        rgba(255, 255, 255, 0.25) 40px,
        transparent 40px,
        transparent 100px
      );
      pointer-events: none;
    }

    .bubble {
      position: absolute; bottom: -50px;
      background: rgba(255, 255, 255, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: floatUp linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0.8; }
      50% { transform: translateY(-50vh) scale(1.1); }
      100% { transform: translateY(-105vh) scale(1); opacity: 0; }
    }

    .seabed-container {
      position: absolute; bottom: 0; width: 100%; height: 160px;
      pointer-events: none; z-index: 1;
    }

    .art-item {
      position: absolute; z-index: 10; pointer-events: none;
    }
    
    .art-body {
      max-width: 350px; max-height: 350px;
      filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.2));
      transition: transform 0.8s ease-out, opacity 3s ease-in;
      transform-origin: center center;
    }

    .fish-wiggle { animation: swimWiggle 2.5s ease-in-out infinite alternate; }
    @keyframes swimWiggle {
      0% { transform: translateY(0px) rotate(-2deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
      100% { transform: translateY(5px) rotate(-1deg); }
    }

    .crab-wiggle { animation: crabWalk 0.4s ease-in-out infinite alternate; }
    @keyframes crabWalk {
      0% { transform: translateY(0px) rotate(-3deg); }
      100% { transform: translateY(-6px) rotate(3deg); }
    }
    
    .fly-away .art-body {
      opacity: 0; transform: scale(0.01) rotate(1080deg) !important;
    }

    .food-item {
      position: absolute;
      width: 26px; height: 26px;
      background: #8d6e63;
      border: 3px solid #5d4037;
      border-radius: 50%;
      z-index: 15;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: top 8s linear, opacity 0.5s;
    }
  </style>
</head>
<body>

  <div class="sunbeams"></div>
  <div id="bubbles-container"></div>

  <div class="seabed-container">
    <svg viewBox="0 0 1200 160" preserveAspectRatio="none" style="width: 100%; height: 100%;">
      <path d="M0,160 L0,120 Q200,90 400,110 T800,100 T1200,110 L1200,160 Z" fill="#ffe082"/>
      <path d="M150,130 Q140,90 155,80 Q165,70 170,85 Q180,65 195,75 Q205,85 195,100 Q210,110 200,130 Z" fill="#ff80ab"/>
      <circle cx="155" cy="80" r="8" fill="#ff80ab"/>
      <circle cx="170" cy="85" r="9" fill="#ff80ab"/>
      <circle cx="195" cy="75" r="8" fill="#ff80ab"/>
      <path d="M80,140 Q60,90 85,40 Q75,90 95,140" stroke="#66bb6a" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M100,140 Q120,80 95,30 Q110,80 110,140" stroke="#81c784" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M1000,135 Q980,100 990,85 Q1005,75 1010,95 Q1025,80 1035,90 Q1040,105 1030,135 Z" fill="#ffb74d"/>
      <path d="M1080,140 Q1100,80 1070,30 Q1090,80 1095,140" stroke="#4caf50" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M1060,140 Q1040,90 1055,50 Q1050,90 1070,140" stroke="#81c784" stroke-width="8" stroke-linecap="round" fill="none"/>
      <polygon points="500,135 505,145 515,145 507,152 510,160 500,155 490,160 493,152 485,145 495,145" fill="#ff7043"/>
    </svg>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase設定[cite: 1, 2]
    const firebaseConfig = {
      apiKey: "AIzaSyC0FLLOsSAd3fYvI1OI1KSUARostoV5HVM",
      authDomain: "espu9owen.firebaseapp.com",
      databaseURL: "https://espu9owen-default-rtdb.firebaseio.com",
      projectId: "espu9owen",
      storageBucket: "espu9owen.firebasestorage.app",
      messagingSenderId: "1003969526788",
      appId: "1:1003969526788:web:00a61b5a0cc2281de54951",
      measurementId: "G-GLW0L4Y53H"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const activeCreatures = [];
    const activeFoods = [];

    document.body.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    const bubblesContainer = document.getElementById('bubbles-container');
    function createBubble() {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const size = Math.random() * 20 + 10;
      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;
      bubble.style.left = `${Math.random() * 100}vw`;
      bubble.style.animationDuration = `${Math.random() * 5 + 5}s`;
      bubblesContainer.appendChild(bubble);
      setTimeout(() => bubble.remove(), 10000);
    }
    setInterval(createBubble, 800);

    onChildAdded(ref(db, 'art_stream'), (snapshot) => {
      const data = snapshot.val();
      createFloatingArt(data.dataURL, data.type || 'fish');
      remove(snapshot.ref);
    });

    onChildAdded(ref(db, 'feed_stream'), (snapshot) => {
      dropFood();
      remove(snapshot.ref);
    });

    function dropFood() {
      const food = document.createElement('div');
      food.className = 'food-item';
      
      const startX = Math.random() * (window.innerWidth - 80) + 40;
      food.style.left = `${startX}px`;
      food.style.top = `-30px`;
      document.body.appendChild(food);

      const foodObj = {
        element: food,
        x: startX,
        y: -30,
        id: Date.now() + Math.random()
      };
      activeFoods.push(foodObj);

      setTimeout(() => {
        food.style.top = `${window.innerHeight - 60}px`;
      }, 50);

      const interval = setInterval(() => {
        const rect = food.getBoundingClientRect();
        foodObj.y = rect.top;
        foodObj.x = rect.left;

        notifyCreaturesToEat(foodObj);

        if (rect.top >= window.innerHeight - 80) {
          clearInterval(interval);
          removeFood(foodObj);
        }
      }, 300);
    }

    function removeFood(foodObj) {
      const idx = activeFoods.indexOf(foodObj);
      if (idx !== -1) {
        activeFoods.splice(idx, 1);
        foodObj.element.style.opacity = '0';
        setTimeout(() => foodObj.element.remove(), 500);
      }
    }

    function notifyCreaturesToEat(foodObj) {
      activeCreatures.forEach(creature => {
        if (!creature.isTargetingFood) {
          creature.targetFood(foodObj);
        }
      });
    }

    function createFloatingArt(dataURL, type) {
      const container = document.createElement('div');
      container.className = 'art-item';

      const img = document.createElement('img');
      img.src = dataURL;
      img.className = `art-body ${type === 'crab' ? 'crab-wiggle' : 'fish-wiggle'}`;
      container.appendChild(img);
      document.body.appendChild(container);

      img.onload = () => {
        let currentX = window.innerWidth / 2 - img.width / 2;
        let currentY = (type === 'crab') 
          ? window.innerHeight - img.height - 40 
          : window.innerHeight / 2 - img.height / 2;

        container.style.left = `${currentX}px`;
        container.style.top = `${currentY}px`;

        let moveTimer = null;
        let isTargetingFood = false;

        const creatureObj = {
          type,
          element: container,
          isTargetingFood: false,
          targetFood: (foodObj) => {
            if (isTargetingFood) return;
            isTargetingFood = true;
            creatureObj.isTargetingFood = true;
            clearTimeout(moveTimer);

            const targetX = Math.max(10, foodObj.x - img.width / 2);
            let targetY = (type === 'crab')
              ? window.innerHeight - img.height - 40
              : Math.max(40, foodObj.y - img.height / 2);

            const deltaX = targetX - currentX;
            const deltaY = targetY - currentY;
            const distance = Math.hypot(deltaX, deltaY);
            const duration = Math.min(Math.max(distance / 250, 1.5), 4);

            container.style.transition = `left ${duration}s ease-in-out, top ${duration}s ease-in-out`;
            container.style.left = `${targetX}px`;
            container.style.top = `${targetY}px`;

            const flipX = deltaX > 0 ? -1 : 1;
            let angle = (type === 'crab') ? 0 : Math.atan2(deltaY, Math.abs(deltaX)) * (180 / Math.PI) * 0.35;
            if (flipX === -1 && type !== 'crab') angle = -angle;

            img.style.transform = `scaleX(${flipX}) rotate(${angle}deg)`;

            currentX = targetX;
            currentY = targetY;

            // ★ 完食後の動きの復帰処理を修正
            moveTimer = setTimeout(() => {
              removeFood(foodObj);
              isTargetingFood = false;
              creatureObj.isTargetingFood = false;

              // 実際の最新位置を同期取得して復帰
              const rect = container.getBoundingClientRect();
              currentX = rect.left;
              currentY = rect.top;

              swim(); // 通常の遊泳・横歩きに戻る
            }, duration * 1000);
          }
        };

        activeCreatures.push(creatureObj);

        const swim = () => {
          if (isTargetingFood) return;

          // 最新の実位置を反映
          const rect = container.getBoundingClientRect();
          currentX = rect.left;
          currentY = rect.top;

          const maxX = Math.max(10, window.innerWidth - img.width - 20);
          let nextX = Math.max(10, Math.random() * maxX);
          let nextY = (type === 'crab') 
            ? window.innerHeight - img.height - (Math.random() * 30 + 30)
            : Math.max(40, Math.random() * (window.innerHeight - img.height - 120));

          const deltaX = nextX - currentX;
          const deltaY = nextY - currentY;
          const distance = Math.hypot(deltaX, deltaY);
          const moveDuration = (type === 'crab') 
            ? Math.min(Math.max(distance / 120, 2), 5)
            : Math.min(Math.max(distance / 180, 3), 6);

          // ★ 通常のイージングへ戻す
          container.style.transition = `left ${moveDuration}s linear, top ${moveDuration}s linear`;
          container.style.left = `${nextX}px`;
          container.style.top = `${nextY}px`;

          const flipX = deltaX > 0 ? -1 : 1;
          let angle = (type === 'crab') ? 0 : Math.atan2(deltaY, Math.abs(deltaX)) * (180 / Math.PI) * 0.35;
          if (flipX === -1 && type !== 'crab') angle = -angle;

          img.style.transform = `scaleX(${flipX}) rotate(${angle}deg)`;

          currentX = nextX;
          currentY = nextY;

          const restTime = Math.random() * 1500 + 1000;
          moveTimer = setTimeout(swim, (moveDuration * 1000) + restTime);
        };

        setTimeout(swim, 300);

        setTimeout(() => {
          clearTimeout(moveTimer);
          const idx = activeCreatures.indexOf(creatureObj);
          if (idx !== -1) activeCreatures.splice(idx, 1);

          container.classList.add('fly-away');
          container.style.transition = `left 3s ease-in, top 3s ease-in`;
          container.style.left = `${window.innerWidth + 500}px`;
          container.style.top = `-500px`;
          setTimeout(() => container.remove(), 3000);
        }, 120000);
      };
    }
  </script>
</body>
</html>
