<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>みんなの絵の広場</title>
  <style>
    /* 画面全体を広場の背景にする */
    body { 
      margin: 0; 
      overflow: hidden; 
      background: #e0f7fa; 
      background-image: radial-gradient(#b2ebf2 2px, transparent 2px);
      background-size: 40px 40px;
      height: 100vh; 
      width: 100vw;
    }
    
    .art-item {
      position: absolute;
      max-width: 250px;
      max-height: 250px;
      /* 動きをなめらかにする設定 */
      transition: left 2.5s ease-in-out, top 2.5s ease-in-out, transform 3s ease-in, opacity 3s ease-in;
    }
    
    /* 2分後に遠くに消えていくアニメーション */
    .fly-away {
      opacity: 0;
      transform: scale(0.01) rotate(1080deg) !important;
    }
  </style>
</head>
<body>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ▼▼▼ あなたのFirebase設定に書き換えてください ▼▼▼
    const firebaseConfig = {
    apiKey: "AIzaSyC0FLLOsSAd3fYvI1OI1KSUARostoV5HVM",
    authDomain: "espu9owen.firebaseapp.com",
    databaseURL: "https://espu9owen-default-rtdb.firebaseio.com",
    projectId: "espu9owen",
    storageBucket: "espu9owen.firebasestorage.app",
    messagingSenderId: "1003969526788",
    appId: "1:1003969526788:web:00a61b5a0cc2281de54951",
    measurementId: "G-GLW0L4Y53H"
    };
    // ▲▲▲ ここまで ▲▲▲

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 新しい絵が届いたときの処理
    onChildAdded(ref(db, 'art_stream'), (snapshot) => {
      const data = snapshot.val();
      createFloatingArt(data.dataURL);
      
      // 受信直後にFirebase上のデータだけ削除（自動お掃除）
      remove(snapshot.ref);
    });

    // 絵を画面に出して動かす関数
    function createFloatingArt(dataURL) {
      const img = document.createElement('img');
      img.src = dataURL;
      img.className = 'art-item';
      document.body.appendChild(img);

      // 画像が読み込まれてサイズが確定したら動き始める
      img.onload = () => {
        // 初期位置は画面の中央付近
        img.style.left = `${window.innerWidth / 2 - img.width / 2}px`;
        img.style.top = `${window.innerHeight / 2 - img.height / 2}px`;

        // ランダムに動かす関数（現在の画面サイズを基準にするため可変対応）
        const move = () => {
          // 画面外にはみ出さないよう、現在のウィンドウ幅から画像の幅を引く
          const maxX = window.innerWidth - img.width;
          const maxY = window.innerHeight - img.height;
          
          // 0 〜 最大値 の間でランダムな座標を計算
          const nextX = Math.max(0, Math.random() * maxX);
          const nextY = Math.max(0, Math.random() * maxY);
          
          img.style.left = `${nextX}px`;
          img.style.top = `${nextY}px`;
        };

        // 最初の動きを少し遅らせて開始
        setTimeout(move, 100);

        // 2.5秒ごとに次の目的地へ移動
        const moveTimer = setInterval(move, 2500);

        // 120秒（2分）後に消滅させる処理
        setTimeout(() => {
          clearInterval(moveTimer);
          
          // 画面外に飛ばすアニメーションを追加
          img.classList.add('fly-away');
          // はるか遠くへ飛ばす（画面サイズに依存させない）
          img.style.left = `${window.innerWidth + 500}px`;
          img.style.top = `-500px`;

          // アニメーションが終わる3秒後に、HTMLから完全に削除
          setTimeout(() => img.remove(), 3000);
          
        }, 120000); // 120000ミリ秒 ＝ 2分
      };
    }
  </script>
</body>
</html>
