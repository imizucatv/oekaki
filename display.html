<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>みんなの水族館 - Smart AI Edition</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="みんなの水族館">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#e1f5fe">

  <style>
    html, body { 
      margin: 0; padding: 0;
      overflow: hidden; 
      height: 100vh; height: 100dvh; width: 100vw;
      background: linear-gradient(180deg, #e1f5fe 0%, #b3e5fc 50%, #4fc3f7 100%);
      position: relative; font-family: sans-serif;
      overscroll-behavior: none; user-select: none;
    }

    .sunbeams {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(
        110deg,
        rgba(255, 255, 255, 0.25) 0px,
        rgba(255, 255, 255, 0.25) 40px,
        transparent 40px,
        transparent 100px
      );
      pointer-events: none;
    }

    .bubble {
      position: absolute; bottom: -50px;
      background: rgba(255, 255, 255, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: floatUp linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0.8; }
      50% { transform: translateY(-50vh) scale(1.1); }
      100% { transform: translateY(-105vh) scale(1); opacity: 0; }
    }

    .seabed-container {
      position: absolute; bottom: 0; width: 100%; height: 160px;
      pointer-events: none; z-index: 1;
    }

    .art-item {
      position: absolute; z-index: 10; pointer-events: none;
      will-change: left, top;
    }

    .art-scaler {
      display: inline-block;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-origin: center center;
    }
    
    .art-body {
      max-width: 240px; max-height: 240px;
      filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.2));
      transition: opacity 3s ease-in;
      transform-origin: center center;
    }

    .fish-wiggle { animation: swimWiggle 2.5s ease-in-out infinite alternate; }
    @keyframes swimWiggle {
      0% { transform: translateY(0px) rotate(-2deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
      100% { transform: translateY(5px) rotate(-1deg); }
    }

    .crab-wiggle { animation: crabWalk 0.4s ease-in-out infinite alternate; }
    @keyframes crabWalk {
      0% { transform: translateY(0px) rotate(-3deg); }
      100% { transform: translateY(-6px) rotate(3deg); }
    }

    .octopus-wiggle { animation: octopusFloat 3s ease-in-out infinite alternate; }
    @keyframes octopusFloat {
      0% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(-18px) scaleY(1.08) scaleX(0.95); }
      100% { transform: translateY(6px) scaleY(0.95) scaleX(1.05); }
    }
    
    .fly-away .art-body {
      opacity: 0; transform: scale(0.01) rotate(1080deg) !important;
    }

    .food-item {
      position: absolute;
      width: 26px; height: 26px;
      background: #8d6e63;
      border: 3px solid #5d4037;
      border-radius: 50%;
      z-index: 15;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: top 8s linear, opacity 0.4s;
    }

    .eat-effect {
      position: absolute;
      font-size: 1.4rem;
      font-weight: bold;
      color: #ff4081;
      background: rgba(255, 255, 255, 0.92);
      padding: 4px 12px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
      animation: popAndFloat 1.4s ease-out forwards;
    }

    @keyframes popAndFloat {
      0% { transform: translate(-50%, 0) scale(0.4); opacity: 0; }
      20% { transform: translate(-50%, -15px) scale(1.2); opacity: 1; }
      70% { transform: translate(-50%, -30px) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -45px) scale(0.8); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="sunbeams"></div>
  <div id="bubbles-container"></div>

  <div class="seabed-container">
    <svg viewBox="0 0 1200 160" preserveAspectRatio="none" style="width: 100%; height: 100%;">
      <path d="M0,160 L0,120 Q200,90 400,110 T800,100 T1200,110 L1200,160 Z" fill="#ffe082"/>
      <path d="M150,130 Q140,90 155,80 Q165,70 170,85 Q180,65 195,75 Q205,85 195,100 Q210,110 200,130 Z" fill="#ff80ab"/>
      <circle cx="155" cy="80" r="8" fill="#ff80ab"/>
      <circle cx="170" cy="85" r="9" fill="#ff80ab"/>
      <circle cx="195" cy="75" r="8" fill="#ff80ab"/>
      <path d="M80,140 Q60,90 85,40 Q75,90 95,140" stroke="#66bb6a" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M100,140 Q120,80 95,30 Q110,80 110,140" stroke="#81c784" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M1000,135 Q980,100 990,85 Q1005,75 1010,95 Q1025,80 1035,90 Q1040,105 1030,135 Z" fill="#ffb74d"/>
      <path d="M1080,140 Q1100,80 1070,30 Q1090,80 1095,140" stroke="#4caf50" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M1060,140 Q1040,90 1055,50 Q1050,90 1070,140" stroke="#81c784" stroke-width="8" stroke-linecap="round" fill="none"/>
      <polygon points="500,135 505,145 515,145 507,152 510,160 500,155 490,160 493,152 485,145 495,145" fill="#ff7043"/>
    </svg>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC0FLLOsSAd3fYvI1OI1KSUARostoV5HVM",
      authDomain: "espu9owen.firebaseapp.com",
      databaseURL: "https://espu9owen-default-rtdb.firebaseio.com",
      projectId: "espu9owen",
      storageBucket: "espu9owen.firebasestorage.app",
      messagingSenderId: "1003969526788",
      appId: "1:1003969526788:web:00a61b5a0cc2281de54951",
      measurementId: "G-GLW0L4Y53H"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const activeCreatures = [];
    const activeFoods = [];

    document.body.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    const bubblesContainer = document.getElementById('bubbles-container');
    function createBubble() {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const size = Math.random() * 20 + 10;
      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;
      bubble.style.left = `${Math.random() * 100}vw`;
      bubble.style.animationDuration = `${Math.random() * 5 + 5}s`;
      bubblesContainer.appendChild(bubble);
      setTimeout(() => bubble.remove(), 10000);
    }
    setInterval(createBubble, 800);

    const MAX_LIFETIME = 120000;

    onChildAdded(ref(db, 'art_stream'), (snapshot) => {
      const data = snapshot.val();
      if (!data || !data.dataURL) return;

      const now = Date.now();
      const createdAt = data.createdAt || now;
      const elapsedTime = now - createdAt;

      if (elapsedTime >= MAX_LIFETIME) {
        remove(snapshot.ref);
      } else {
        const remainingLife = MAX_LIFETIME - elapsedTime;
        createFloatingArt(data.dataURL, data.type || 'fish', snapshot.ref, remainingLife);
      }
    });

    onChildAdded(ref(db, 'feed_stream'), (snapshot) => {
      dropFood();
      remove(snapshot.ref);
    });

    // ★ エサの落下位置（端に行きすぎないよう左右160pxの安全マージンを設定）
    function dropFood() {
      const food = document.createElement('div');
      food.className = 'food-item';
      
      const margin = Math.min(180, Math.max(100, window.innerWidth * 0.15));
      const startX = Math.random() * (window.innerWidth - margin * 2) + margin;
      const startY = -30;
      const targetY = window.innerHeight - 60;
      const fallDuration = 8000;
      const startTime = Date.now();

      food.style.left = `${startX}px`;
      food.style.top = `${startY}px`;
      document.body.appendChild(food);

      setTimeout(() => { food.style.top = `${targetY}px`; }, 50);

      const foodObj = {
        element: food,
        x: startX + 13,
        y: startY + 13,
        isEaten: false,
        id: Date.now() + Math.random()
      };
      activeFoods.push(foodObj);

      const interval = setInterval(() => {
        if (foodObj.isEaten) {
          clearInterval(interval);
          return;
        }

        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / fallDuration, 1);
        foodObj.y = (startY + (targetY - startY) * progress) + 13;

        if (progress >= 1) {
          clearInterval(interval);
          removeFood(foodObj);
        }
      }, 150);
    }

    function removeFood(foodObj) {
      if (foodObj.isEaten) return;
      foodObj.isEaten = true;

      const idx = activeFoods.indexOf(foodObj);
      if (idx !== -1) activeFoods.splice(idx, 1);

      if (foodObj.element) {
        foodObj.element.style.opacity = '0';
        setTimeout(() => foodObj.element.remove(), 300);
      }
    }

    function showEatEffect(x, y, text) {
      const effect = document.createElement('div');
      effect.className = 'eat-effect';
      effect.innerText = text;
      effect.style.left = `${x}px`;
      effect.style.top = `${y}px`;
      document.body.appendChild(effect);
      setTimeout(() => effect.remove(), 1400);
    }

    function createFloatingArt(dataURL, type, dbRef, remainingLife) {
      const container = document.createElement('div');
      container.className = 'art-item';

      const scaler = document.createElement('div');
      scaler.className = 'art-scaler';

      const img = document.createElement('img');
      img.src = dataURL;

      let animationClass = 'fish-wiggle';
      if (type === 'crab') animationClass = 'crab-wiggle';
      if (type === 'octopus') animationClass = 'octopus-wiggle';
      img.className = `art-body ${animationClass}`;

      scaler.appendChild(img);
      container.appendChild(scaler);
      document.body.appendChild(container);

      img.onload = () => {
        const baseW = img.offsetWidth || 180;
        const baseH = img.offsetHeight || 180;

        const getRealPos = () => {
          const style = window.getComputedStyle(container);
          const rx = parseFloat(style.left) || 0;
          const ry = parseFloat(style.top) || 0;
          const currentW = baseW * currentScale;
          const currentH = baseH * currentScale;
          return {
            x: rx + currentW / 2,
            y: ry + currentH / 2,
            left: rx,
            top: ry
          };
        };

        let startX = Math.random() * (window.innerWidth - baseW - 120) + 60;
        let startY = (type === 'crab') 
          ? window.innerHeight - baseH - 40 
          : Math.random() * (window.innerHeight - baseH - 200) + 60;

        container.style.left = `${startX}px`;
        container.style.top = `${startY}px`;

        let moveTimer = null;
        let aiInterval = null;
        let isTargetingFood = false;
        let currentTargetFood = null;
        let isLeaving = false;

        let eatenCount = 0;
        const maxEatCount = 5;
        let isFull = false;
        let currentScale = 1.0;

        const updateTransform = (flipX, angle = 0) => {
          scaler.style.transform = `scaleX(${flipX}) rotate(${angle}deg) scale(${currentScale})`;
        };

        const moveTo = (tx, ty, isFast = false) => {
          const realPos = getRealPos();
          const currentW = baseW * currentScale;
          const currentH = baseH * currentScale;

          const maxX = Math.max(20, window.innerWidth - currentW - 40);
          const targetX = Math.min(Math.max(20, tx), maxX);

          let targetY;
          if (type === 'crab') {
            targetY = window.innerHeight - currentH - 40;
          } else {
            targetY = Math.min(Math.max(40, ty), window.innerHeight - currentH - 120);
          }

          const deltaX = targetX - realPos.left;
          const deltaY = targetY - realPos.top;
          const distance = Math.hypot(deltaX, deltaY);
          const speed = isFast ? 220 : 140;
          const duration = Math.min(Math.max(distance / speed, 1.2), 5);

          container.style.transition = `left ${duration}s ${isFast ? 'ease-in-out' : 'linear'}, top ${duration}s ${isFast ? 'ease-in-out' : 'linear'}`;
          container.style.left = `${targetX}px`;
          container.style.top = `${targetY}px`;

          const flipX = deltaX > 0 ? -1 : 1;
          let angle = (type === 'crab' || type === 'octopus') ? 0 : Math.atan2(deltaY, Math.abs(deltaX)) * (180 / Math.PI) * 0.35;
          if (flipX === -1 && type === 'fish') angle = -angle;

          updateTransform(flipX, angle);

          return duration * 1000;
        };

        const targetFood = (foodObj) => {
          if (isTargetingFood || isLeaving || isFull || foodObj.isEaten) return;

          isTargetingFood = true;
          currentTargetFood = foodObj;
          clearTimeout(moveTimer);

          moveTo(foodObj.x - (baseW * currentScale) / 2, foodObj.y - (baseH * currentScale) / 2, true);
        };

        const swim = () => {
          if (isTargetingFood || isLeaving) return;

          const currentW = baseW * currentScale;
          const currentH = baseH * currentScale;

          const maxX = Math.max(30, window.innerWidth - currentW - 50);
          let nextX = Math.min(Math.max(30, Math.random() * maxX), maxX);
          let nextY;

          if (type === 'crab') {
            nextY = window.innerHeight - currentH - 40;
          } else if (type === 'octopus') {
            nextY = Math.min(Math.max(100, Math.random() * (window.innerHeight - currentH - 100)), window.innerHeight - currentH - 100);
          } else {
            nextY = Math.min(Math.max(50, Math.random() * (window.innerHeight - currentH - 140)), window.innerHeight - currentH - 120);
          }

          const durationMs = moveTo(nextX, nextY, false);
          const restTime = Math.random() * 1500 + 1000;

          moveTimer = setTimeout(swim, durationMs + restTime);
        };

        // 🧠 リアルタイム高精度AI（一番近いエサの探索 ＆ カニ専用Hitbox判定）
        let targetUpdateCounter = 0;
        aiInterval = setInterval(() => {
          if (isLeaving) {
            clearInterval(aiInterval);
            return;
          }

          const realPos = getRealPos();

          // ★ 1. まだエサを追いかけていない場合 ➔ 自分に一番「近い」エサを検索！
          if (!isTargetingFood && !isFull && activeFoods.length > 0) {
            let closestFood = null;
            let minDistance = Infinity;

            activeFoods.forEach(food => {
              if (food.isEaten) return;

              // 🦀 カニはエサが海底付近（底から220px以内）に届くまで反応しない
              if (type === 'crab' && food.y < window.innerHeight - 220) return;

              const dist = Math.hypot(food.x - realPos.x, food.y - realPos.y);
              if (dist < minDistance) {
                minDistance = dist;
                closestFood = food;
              }
            });

            if (closestFood) {
              targetFood(closestFood);
            }
          }

          // ★ 2. エサを追跡中の場合 ➔ 距離チェック＆食いつき判定
          if (isTargetingFood && currentTargetFood) {
            if (currentTargetFood.isEaten) {
              isTargetingFood = false;
              currentTargetFood = null;
              swim();
              return;
            }

            // ★ 当たり判定（Hitbox）の計算：カニと魚で柔軟に切り替え
            let isHit = false;
            if (type === 'crab') {
              // 🦀 カニ：X方向のズレが45px以内 ＆ エサが海底（底から180px以内）に到達したらHit！
              const dx = Math.abs(currentTargetFood.x - realPos.x);
              if (dx < 45 && currentTargetFood.y >= window.innerHeight - 180) {
                isHit = true;
              }
            } else {
              // 🐟 魚・クラゲ：実座標の中心距離が45px以内ならHit！
              const dist = Math.hypot(currentTargetFood.x - realPos.x, currentTargetFood.y - realPos.y);
              if (dist < 45) {
                isHit = true;
              }
            }

            if (isHit) {
              removeFood(currentTargetFood);
              isTargetingFood = false;
              currentTargetFood = null;

              eatenCount++;
              currentScale += 0.10;

              scaler.style.transform += ` scale(1.15)`;
              setTimeout(() => {
                const flipX = (container.style.left.replace('px','') > realPos.left) ? -1 : 1;
                updateTransform(flipX, 0);
              }, 200);

              if (eatenCount >= maxEatCount) {
                isFull = true;
                showEatEffect(realPos.x, realPos.y - 30, "🈵 おなかいっぱい！💤");
              } else {
                const messages = ["❤️ ぱくっ！", "✨ モグモグ！", "😋 おいしい！", "🎵 もぐもぐ！"];
                const msg = messages[Math.floor(Math.random() * messages.length)];
                showEatEffect(realPos.x, realPos.y - 30, msg);
              }

              moveTimer = setTimeout(swim, 600);
            } else {
              // 追跡ターゲット位置の定期更新
              targetUpdateCounter++;
              if (targetUpdateCounter % 3 === 0) {
                moveTo(currentTargetFood.x - (baseW * currentScale) / 2, currentTargetFood.y - (baseH * currentScale) / 2, true);
              }
            }
          }
        }, 150);

        const creatureObj = { type };
        activeCreatures.push(creatureObj);
        setTimeout(swim, 300);

        setTimeout(() => {
          isLeaving = true;
          isTargetingFood = false;
          clearTimeout(moveTimer);
          clearInterval(aiInterval);

          const idx = activeCreatures.indexOf(creatureObj);
          if (idx !== -1) activeCreatures.splice(idx, 1);

          container.classList.add('fly-away');
          container.style.transition = `left 3s ease-in, top 3s ease-in`;
          container.style.left = `${window.innerWidth + 500}px`;
          container.style.top = `-500px`;

          setTimeout(() => {
            container.remove();
            if (dbRef) remove(dbRef);
          }, 3000);
        }, remainingLife);

        window.addEventListener('resize', () => {
          if (isLeaving) return;
          const realPos = getRealPos();
          const currentW = baseW * currentScale;
          const currentH = baseH * currentScale;
          let safeX = Math.min(realPos.left, window.innerWidth - currentW - 20);
          let safeY = (type === 'crab') 
            ? window.innerHeight - currentH - 40 
            : Math.min(realPos.top, window.innerHeight - currentH - 20);

          container.style.left = `${safeX}px`;
          container.style.top = `${safeY}px`;
        });
      };
    }
  </script>
</body>
</html>
