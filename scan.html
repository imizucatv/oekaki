<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>お絵描きスキャナー</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: #222;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      color: #fff;
    }

    .header {
      padding: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      background: rgba(0,0,0,0.5);
      width: 100%;
      box-sizing: border-box;
    }

    .camera-container {
      position: relative;
      width: 90vw;
      height: 65dvh;
      max-width: 800px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      background: #333;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 透過状態確認用の市松模様背景 */
    #previewCanvas {
      display: none;
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      background-color: #fff;
      background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), 
                        linear-gradient(-45deg, #ccc 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #ccc 75%), 
                        linear-gradient(-45deg, transparent 75%, #ccc 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    /* ガイド枠 */
    .guide-frame {
      position: absolute;
      width: 75vw;
      height: 75vw;
      max-width: 420px;
      max-height: 420px;
      border: 4px dashed #ff5252;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    .guide-text {
      background: rgba(255, 82, 82, 0.85);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .controls {
      padding: 15px;
      display: flex;
      gap: 15px;
      justify-content: center;
      width: 100%;
      background: rgba(0,0,0,0.5);
      box-sizing: border-box;
    }

    button {
      font-size: 1.1rem;
      padding: 12px 24px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: 0.1s;
    }
    button:active { transform: scale(0.95); }

    .btn-scan { background: #ff9800; color: #fff; font-size: 1.3rem; padding: 14px 32px; box-shadow: 0 4px 10px rgba(255,152,0,0.4); }
    .btn-send { background: #4caf50; color: #fff; display: none; }
    .btn-retry { background: #757575; color: #fff; display: none; }

    #processCanvas { display: none; }
  </style>
</head>
<body>

  <div class="header">しかくい赤枠の中にえを入れてね！</div>

  <div class="camera-container" id="cameraContainer">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="previewCanvas"></canvas>
    
    <div class="guide-frame" id="guideFrame">
      <span class="guide-text" id="guideText">ここに絵を入れてね</span>
    </div>
  </div>

  <div class="controls">
    <button id="btnScan" class="btn-scan" onclick="captureAndCrop()">📷 スキャン！</button>
    <button id="btnRetry" class="btn-retry" onclick="resetScan()">🔄 とりなおす</button>
    <button id="btnSend" class="btn-send" onclick="sendToAquarium()">🚀 およがせる！</button>
  </div>

  <canvas id="processCanvas"></canvas>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase設定
    const firebaseConfig = {
      apiKey: "AIzaSyC0FLLOsSAd3fYvI1OI1KSUARostoV5HVM",
      authDomain: "espu9owen.firebaseapp.com",
      databaseURL: "https://espu9owen-default-rtdb.firebaseio.com",
      projectId: "espu9owen",
      storageBucket: "espu9owen.firebasestorage.app",
      messagingSenderId: "1003969526788",
      appId: "1:1003969526788:web:00a61b5a0cc2281de54951",
      measurementId: "G-GLW0L4Y53H"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const video = document.getElementById('video');
    const cameraContainer = document.getElementById('cameraContainer');
    const guideFrame = document.getElementById('guideFrame');
    const processCanvas = document.getElementById('processCanvas');
    const previewCanvas = document.getElementById('previewCanvas');
    const ctx = processCanvas.getContext('2d', { willReadFrequently: true });
    
    let processedDataURL = null;

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("カメラが起動できませんでした。アクセス許可を確認してください。");
      }
    }
    initCamera();

    // ★ 用紙の黒枠自動特定 ＆ 消去アルゴリズム
    window.captureAndCrop = function() {
      if (!video.videoWidth || !video.videoHeight) return;

      const containerRect = cameraContainer.getBoundingClientRect();
      const guideRect = guideFrame.getBoundingClientRect();

      const vWidth = video.videoWidth;
      const vHeight = video.videoHeight;

      const containerRatio = containerRect.width / containerRect.height;
      const videoRatio = vWidth / vHeight;

      let renderWidth, renderHeight, offsetX, offsetY;
      if (containerRatio > videoRatio) {
        renderWidth = containerRect.width;
        renderHeight = containerRect.width / videoRatio;
        offsetX = 0;
        offsetY = (renderHeight - containerRect.height) / 2;
      } else {
        renderWidth = containerRect.height * videoRatio;
        renderHeight = containerRect.height;
        offsetX = (renderWidth - containerRect.width) / 2;
        offsetY = 0;
      }

      const scale = vWidth / renderWidth;
      const guideLeft = guideRect.left - containerRect.left;
      const guideTop = guideRect.top - containerRect.top;

      const cropX = Math.floor((guideLeft + offsetX) * scale);
      const cropY = Math.floor((guideTop + offsetY) * scale);
      const cropW = Math.floor(guideRect.width * scale);
      const cropH = Math.floor(guideRect.height * scale);

      const rawCanvas = document.createElement('canvas');
      rawCanvas.width = vWidth;
      rawCanvas.height = vHeight;
      const rawCtx = rawCanvas.getContext('2d');
      rawCtx.drawImage(video, 0, 0);

      processCanvas.width = cropW;
      processCanvas.height = cropH;
      ctx.drawImage(rawCanvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      const imgData = ctx.getImageData(0, 0, cropW, cropH);
      const data = imgData.data;

      // ----------------------------------------------------
      // 1. 用紙の正方形「黒枠」の位置を外側から自動特定
      // ----------------------------------------------------
      const isBlackPixel = (x, y) => {
        const idx = (Math.floor(y) * cropW + Math.floor(x)) * 4;
        const brightness = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
        return brightness < 110;
      };

      let innerLeft = 0;
      let innerRight = cropW;
      let innerTop = 0;
      let innerBottom = cropH;

      const midY = cropH / 2;
      const midX = cropW / 2;

      // 左から右へ走査して黒枠の「内側の縁」を発見
      for (let x = 0; x < midX; x++) {
        if (isBlackPixel(x, midY)) {
          while (x < midX && isBlackPixel(x, midY)) x++; // 黒枠の太さを通過
          innerLeft = x + 6; // 黒枠の内側+6px余白
          break;
        }
      }

      // 右から左へ走査
      for (let x = cropW - 1; x > midX; x--) {
        if (isBlackPixel(x, midY)) {
          while (x > midX && isBlackPixel(x, midY)) x--;
          innerRight = x - 6;
          break;
        }
      }

      // 上から下へ走査
      for (let y = 0; y < midY; y++) {
        if (isBlackPixel(midX, y)) {
          while (y < midY && isBlackPixel(midX, y)) y++;
          innerTop = y + 6;
          break;
        }
      }

      // 下から上へ走査
      for (let y = cropH - 1; y > midY; y--) {
        if (isBlackPixel(midX, y)) {
          while (y > midY && isBlackPixel(midX, y)) y--;
          innerBottom = y - 6;
          break;
        }
      }

      // 安全装置：もし黒枠が見つからなかった場合、外周10%を落とす
      if (innerLeft === 0) innerLeft = Math.floor(cropW * 0.1);
      if (innerRight === cropW) innerRight = Math.floor(cropW * 0.9);
      if (innerTop === 0) innerTop = Math.floor(cropH * 0.1);
      if (innerBottom === cropH) innerBottom = Math.floor(cropH * 0.9);

      // ----------------------------------------------------
      // 2. 黒枠および黒枠より外側をすべて完全消去（透明化）
      // ----------------------------------------------------
      let minX = cropW, maxX = 0, minY = cropH, maxY = 0;
      let hasContent = false;

      for (let y = 0; y < cropH; y++) {
        for (let x = 0; x < cropW; x++) {
          const idx = (y * cropW + x) * 4;

          // 黒枠より外側は強制的に透明化
          if (x < innerLeft || x > innerRight || y < innerTop || y > innerBottom) {
            data[idx + 3] = 0;
            continue;
          }

          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];

          const brightness = (r + g + b) / 3;
          const colorDiff = Math.max(r, g, b) - Math.min(r, g, b);

          const isBlackLine = brightness < 120;
          const isColoredLine = (colorDiff > 25) && (brightness < 220);

          if (isBlackLine || isColoredLine) {
            data[idx + 3] = 255;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
            hasContent = true;
          } else {
            data[idx + 3] = 0; // 白紙・影を消去
          }
        }
      }

      if (!hasContent || minX >= maxX || minY >= maxY) {
        alert("枠の中に絵が見つからなかったよ！黒ペンやクーピーで濃く描いてね。");
        return;
      }

      const pad = 6;
      minX = Math.max(0, minX - pad);
      minY = Math.max(0, minY - pad);
      maxX = Math.min(cropW, maxX + pad);
      maxY = Math.min(cropH, maxY + pad);

      const srcW = maxX - minX;
      const srcH = maxY - minY;

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = cropW;
      tempCanvas.height = cropH;
      tempCanvas.getContext('2d').putImageData(imgData, 0, 0);

      // 500x500のキャンバス中央に魚・カニのイラストを自動拡大描画
      const targetSize = 500;
      previewCanvas.width = targetSize;
      previewCanvas.height = targetSize;

      const pCtx = previewCanvas.getContext('2d');
      pCtx.clearRect(0, 0, targetSize, targetSize);

      const fitScale = Math.min((targetSize - 20) / srcW, (targetSize - 20) / srcH);
      const destW = srcW * fitScale;
      const destH = srcH * fitScale;
      const destX = (targetSize - destW) / 2;
      const destY = (targetSize - destH) / 2;

      pCtx.drawImage(tempCanvas, minX, minY, srcW, srcH, destX, destY, destW, destH);

      processedDataURL = previewCanvas.toDataURL("image/png");

      // 表示切替
      video.style.display = 'none';
      document.getElementById('guideFrame').style.display = 'none';
      previewCanvas.style.display = 'block';

      document.getElementById('btnScan').style.display = 'none';
      document.getElementById('btnRetry').style.display = 'inline-block';
      document.getElementById('btnSend').style.display = 'inline-block';
    };

    window.resetScan = function() {
      video.style.display = 'block';
      document.getElementById('guideFrame').style.display = 'flex';
      previewCanvas.style.display = 'none';

      document.getElementById('btnScan').style.display = 'inline-block';
      document.getElementById('btnRetry').style.display = 'none';
      document.getElementById('btnSend').style.display = 'none';
    };

    window.sendToAquarium = function() {
      if (!processedDataURL) return;

      push(ref(db, 'art_stream'), { dataURL: processedDataURL, createdAt: Date.now() })
        .then(() => {
          alert("すいぞくかんにおくったよ！");
          resetScan();
        })
        .catch((err) => {
          alert("送信エラーが発生しました。");
          console.error(err);
        });
    };
  </script>
</body>
</html>
