<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>お絵描きスキャナー</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: #222;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      color: #fff;
    }

    .header {
      padding: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      background: rgba(0,0,0,0.5);
      width: 100%;
      box-sizing: border-box;
    }

    /* カメラ映像とプレビューの表示エリア */
    .camera-container {
      position: relative;
      width: 90vw;
      height: 65dvh;
      max-width: 800px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 撮影後に切り抜かれた絵を確認するプレビュー用キャンバス */
    #previewCanvas {
      display: none;
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
    }

    /* 画面上の赤枠ガイド */
    .guide-frame {
      position: absolute;
      width: 80%;
      height: 80%;
      border: 4px dashed #ff5252;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .guide-text {
      background: rgba(255, 82, 82, 0.85);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    /* ボタン群 */
    .controls {
      padding: 15px;
      display: flex;
      gap: 15px;
      justify-content: center;
      width: 100%;
      background: rgba(0,0,0,0.5);
      box-sizing: border-box;
    }

    button {
      font-size: 1.1rem;
      padding: 12px 24px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: 0.1s;
    }
    button:active { transform: scale(0.95); }

    .btn-scan { background: #ff9800; color: #fff; font-size: 1.3rem; padding: 14px 32px; box-shadow: 0 4px 10px rgba(255,152,0,0.4); }
    .btn-send { background: #4caf50; color: #fff; display: none; }
    .btn-retry { background: #757575; color: #fff; display: none; }

    /* 内部処理用のCanvas（非表示） */
    #processCanvas { display: none; }
  </style>
</head>
<body>

  <div class="header">枠の中に紙のえを合わせてね！</div>

  <div class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <!-- 切り抜かれたイラストだけを表示するプレビューエリア -->
    <canvas id="previewCanvas"></canvas>
    
    <div class="guide-frame" id="guideFrame">
      <span class="guide-text" id="guideText">ここに絵を入れてね</span>
    </div>
  </div>

  <div class="controls">
    <button id="btnScan" class="btn-scan" onclick="captureAndCrop()">📷 スキャン！</button>
    <button id="btnRetry" class="btn-retry" onclick="resetScan()">🔄 とりなおす</button>
    <button id="btnSend" class="btn-send" onclick="sendToAquarium()">🚀 およがせる！</button>
  </div>

  <canvas id="processCanvas"></canvas>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase設定[cite: 1, 2]
    const firebaseConfig = {
      apiKey: "AIzaSyC0FLLOsSAd3fYvI1OI1KSUARostoV5HVM",
      authDomain: "espu9owen.firebaseapp.com",
      databaseURL: "https://espu9owen-default-rtdb.firebaseio.com",
      projectId: "espu9owen",
      storageBucket: "espu9owen.firebasestorage.app",
      messagingSenderId: "1003969526788",
      appId: "1:1003969526788:web:00a61b5a0cc2281de54951",
      measurementId: "G-GLW0L4Y53H"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const video = document.getElementById('video');
    const processCanvas = document.getElementById('processCanvas');
    const previewCanvas = document.getElementById('previewCanvas');
    const ctx = processCanvas.getContext('2d', { willReadFrequently: true });
    
    let processedDataURL = null;

    // 背面カメラの起動
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("カメラが起動できませんでした。アクセス許可を確認してください。");
      }
    }
    initCamera();

    // ★ イラスト自動抽出＆背景消去アルゴリズム
    window.captureAndCrop = function() {
      processCanvas.width = video.videoWidth;
      processCanvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, processCanvas.width, processCanvas.height);

      // ガイド枠（中央80%）の範囲を計算
      const cropW = Math.floor(processCanvas.width * 0.8);
      const cropH = Math.floor(processCanvas.height * 0.8);
      const startX = Math.floor((processCanvas.width - cropW) / 2);
      const startY = Math.floor((processCanvas.height - cropH) / 2);

      const imgData = ctx.getImageData(startX, startY, cropW, cropH);
      const data = imgData.data;

      // イラストが存在する最外郭（バウンディングボックス）を判定する変数
      let minX = cropW, maxX = 0, minY = cropH, maxY = 0;
      let hasContent = false;

      // ピクセルごとの色の解析（紙の白/影 を消し、ペン・色のついた部分だけを検出）
      for (let y = 0; y < cropH; y++) {
        for (let x = 0; x < cropW; x++) {
          const idx = (y * cropW + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];

          // 色の鮮やかさ（彩度）と明るさ（輝度）を計算
          const maxC = Math.max(r, g, b);
          const minC = Math.min(r, g, b);
          const colorDiff = maxC - minC; // 彩度合い
          const brightness = (r + g + b) / 3; // 明るさ

          // 【イラスト判定基準】
          // 1. 黒や濃い色のペン（明るさが低い: < 160）
          // 2. クレヨンやマーカーなどのカラー（RGBの差が大きい: > 25）
          const isDrawing = (brightness < 160) || (colorDiff > 25);

          if (isDrawing) {
            data[idx + 3] = 255; // 不透明（残す）
            
            // イラストの範囲（境界）を更新
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
            hasContent = true;
          } else {
            // 紙の白・机の影・枠外はすべて透明にする
            data[idx + 3] = 0; 
          }
        }
      }

      if (!hasContent) {
        alert("えが見つからなかったよ！もう少し濃く描くか、明るいところで試してみてね。");
        return;
      }

      // 検出されたイラストのまわりに少しだけ余白（15px）を追加
      const pad = 15;
      minX = Math.max(0, minX - pad);
      minY = Math.max(0, minY - pad);
      maxX = Math.min(cropW, maxX + pad);
      maxY = Math.min(cropH, maxY + pad);

      const finalWidth = maxX - minX;
      const finalHeight = maxY - minY;

      // 抽出したイラストの範囲だけをプレビュー用Canvasに描画（クロップ処理）
      previewCanvas.width = finalWidth;
      previewCanvas.height = finalHeight;

      // 一時的なCanvasを使ってピクセルデータを再構成
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = cropW;
      tempCanvas.height = cropH;
      tempCanvas.getContext('2d').putImageData(imgData, 0, 0);

      const pCtx = previewCanvas.getContext('2d');
      pCtx.drawImage(tempCanvas, minX, minY, finalWidth, finalHeight, 0, 0, finalWidth, finalHeight);

      // WebP画像として保存
      processedDataURL = previewCanvas.toDataURL("image/webp", 0.7);

      // 表示の切り替え（カメラ映像を隠し、切り抜かれたイラストを表示）
      video.style.display = 'none';
      document.getElementById('guideFrame').style.display = 'none';
      previewCanvas.style.display = 'block';

      document.getElementById('btnScan').style.display = 'none';
      document.getElementById('btnRetry').style.display = 'inline-block';
      document.getElementById('btnSend').style.display = 'inline-block';
    };

    // 取り直し（カメラ映像に戻す）
    window.resetScan = function() {
      video.style.display = 'block';
      document.getElementById('guideFrame').style.display = 'flex';
      previewCanvas.style.display = 'none';

      document.getElementById('btnScan').style.display = 'inline-block';
      document.getElementById('btnRetry').style.display = 'none';
      document.getElementById('btnSend').style.display = 'none';
    };

    // 送信
    window.sendToAquarium = function() {
      if (!processedDataURL) return;

      push(ref(db, 'art_stream'), { dataURL: processedDataURL, createdAt: Date.now() });
      
      alert("すいぞくかんにおくったよ！");
      resetScan();
    };
  </script>
</body>
</html>
