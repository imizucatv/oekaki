<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>じゆうにお絵描きキャンバス</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100dvh;
      overflow: hidden;
      background-color: #e0f7fa;
      font-family: sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      user-select: none;
    }

    .header {
      padding: max(8px, 1vh); font-size: 1.1rem; font-weight: bold;
      text-align: center; background: rgba(255,255,255,0.8); width: 100%; box-sizing: border-box;
      color: #004d40;
    }

    .canvas-container {
      position: relative; width: 92vw; height: 58dvh; max-width: 800px;
      display: flex; justify-content: center; align-items: center;
      background: #ffffff; border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0, 105, 92, 0.15);
      border: 4px solid #80deea; touch-action: none;
    }

    canvas {
      width: 100%; height: 100%; border-radius: 16px;
      cursor: crosshair;
    }

    /* ツールバー＆カラーパレット */
    .toolbar {
      width: 92vw; max-width: 800px;
      display: flex; flex-direction: column; gap: 8px;
      align-items: center; padding: 6px;
    }

    .colors {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    }

    .color-btn {
      width: 36px; height: 36px; border-radius: 50%; border: 3px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2); cursor: pointer; transition: transform 0.1s;
    }
    .color-btn.active {
      transform: scale(1.25); border-color: #004d40;
    }

    .controls {
      padding: 10px; display: flex; gap: 12px; justify-content: center;
      width: 100%; box-sizing: border-box;
    }

    button {
      font-size: 1.1rem; padding: 10px 20px; border-radius: 30px; border: none;
      cursor: pointer; font-weight: bold; transition: 0.1s; outline: none;
    }
    button:active { transform: scale(0.95); }

    .btn-clear { background: #757575; color: #fff; }
    .btn-send { background: #ab47bc; color: #fff; font-size: 1.2rem; padding: 12px 28px; box-shadow: 0 4px 10px rgba(171,71,188,0.3); }

    /* ★ マナー案内＆生物選択モーダル ★ */
    .modal-overlay {
      display: none;
      position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
      background: rgba(0,0,0,0.85); z-index: 100;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 20px; box-sizing: border-box;
    }

    .modal-card {
      background: #ffffff; border-radius: 24px; padding: 20px;
      max-width: 400px; width: 90%; text-align: center; color: #333;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .modal-notice {
      background: #fff3e0; border: 2px dashed #ff9800; border-radius: 16px;
      padding: 12px; font-size: 0.95rem; color: #e65100; font-weight: bold;
      line-height: 1.4; margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.3rem; font-weight: bold; color: #004d40; margin-bottom: 12px;
    }

    .modal-buttons {
      display: flex; flex-direction: column; gap: 10px; width: 100%;
    }

    .btn-choice {
      font-size: 1.2rem; padding: 14px; border-radius: 30px; border: none;
      color: #fff; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: transform 0.1s;
    }
    .btn-choice:active { transform: scale(0.95); }
    .choice-fish { background: #2196f3; }
    .choice-crab { background: #ff9800; }
    .choice-octopus { background: #e91e63; }
    .btn-back { background: #b0bec5; color: #37474f; margin-top: 6px; font-size: 0.95rem; padding: 8px; }

    #loadingOverlay {
      display: none;
      position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
      background: rgba(0,0,0,0.6); z-index: 200;
      flex-direction: column; align-items: center; justify-content: center;
      color: #fff; font-size: 1.4rem; font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">🎨 じゆうにお絵描きしてみよう！</div>

  <div class="canvas-container">
    <canvas id="drawCanvas"></canvas>
  </div>

  <div class="toolbar">
    <div class="colors">
      <div class="color-btn active" style="background:#000000;" onclick="setPenColor('#000000', this)"></div>
      <div class="color-btn" style="background:#e53935;" onclick="setPenColor('#e53935', this)"></div>
      <div class="color-btn" style="background:#1e88e5;" onclick="setPenColor('#1e88e5', this)"></div>
      <div class="color-btn" style="background:#43a047;" onclick="setPenColor('#43a047', this)"></div>
      <div class="color-btn" style="background:#fdd835;" onclick="setPenColor('#fdd835', this)"></div>
      <div class="color-btn" style="background:#fb8c00;" onclick="setPenColor('#fb8c00', this)"></div>
      <div class="color-btn" style="background:#d81b60;" onclick="setPenColor('#d81b60', this)"></div>
      <div class="color-btn" style="background:#8d6e63;" onclick="setPenColor('#8d6e63', this)"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-clear" onclick="clearCanvas()">🗑️ けす</button>
    <button class="btn-send" onclick="openChoiceModal()">🚀 およがせる！</button>
  </div>

  <!-- ★ 送信前マナー案内 ＆ 生物選択モーダル ★ -->
  <div class="modal-overlay" id="choiceModal">
    <div class="modal-card">
      
      <!-- 注意書き案内 -->
      <div class="modal-notice">
        ⚠️ おねがい<br>
        みんなが たのしくあそべるように、ひとを きずつける ことばや 絵は かいていないかな？
      </div>

      <div class="modal-title">どれで およがせる？</div>

      <div class="modal-buttons">
        <button class="btn-choice choice-fish" onclick="selectAndSend('fish')">🐟 さかな</button>
        <button class="btn-choice choice-crab" onclick="selectAndSend('crab')">🦀 カニ</button>
        <button class="btn-choice choice-octopus" onclick="selectAndSend('octopus')">🐙 たこ・くらげ</button>
        <button class="btn-choice btn-back" onclick="closeChoiceModal()">← かきなおす</button>
      </div>

    </div>
  </div>

  <div id="loadingOverlay">
    <div style="font-size: 3.5rem;">🚀</div>
    <div style="margin-top: 10px;">すいぞくかんへ おくっているよ...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC0FLLOsSAd3fYvI1OI1KSUARostoV5HVM",
      authDomain: "espu9owen.firebaseapp.com",
      databaseURL: "https://espu9owen-default-rtdb.firebaseio.com",
      projectId: "espu9owen",
      storageBucket: "espu9owen.firebasestorage.app",
      messagingSenderId: "1003969526788",
      appId: "1:1003969526788:web:00a61b5a0cc2281de54951",
      measurementId: "G-GLW0L4Y53H"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    const loadingOverlay = document.getElementById('loadingOverlay');

    let isDrawing = false;
    let currentColor = '#000000';
    let currentLineWidth = 8;
    let hasDrawn = false;

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * 2;
      canvas.height = rect.height * 2;
      ctx.scale(2, 2);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.setPenColor = function(color, btn) {
      currentColor = color;
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDraw(e) {
      isDrawing = true;
      hasDrawn = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = currentLineWidth;
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDraw() {
      isDrawing = false;
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseleave', stopDraw);

    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDraw);

    window.clearCanvas = function() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasDrawn = false;
    };

    window.openChoiceModal = function() {
      if (!hasDrawn) {
        alert("えが かかれていないよ！なにか かいてみてね。");
        return;
      }
      document.getElementById('choiceModal').style.display = 'flex';
    };

    window.closeChoiceModal = function() {
      document.getElementById('choiceModal').style.display = 'none';
    };

    window.selectAndSend = function(type) {
      document.getElementById('choiceModal').style.display = 'none';
      loadingOverlay.style.display = 'flex';

      // 水族館背景に馴染ませるため透明背景画像データ（PNG）として取得
      const dataURL = canvas.toDataURL("image/png");

      push(ref(db, 'art_stream'), { 
        dataURL: dataURL, 
        type: type,
        createdAt: Date.now() 
      }).then(() => {
        loadingOverlay.style.display = 'none';
        alert("すいぞくかんにおくったよ！");
        clearCanvas();
      }).catch(() => {
        loadingOverlay.style.display = 'none';
        alert("エラーがおきたよ。もういちどためしてね。");
      });
    };
  </script>
</body>
</html>
