<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わくわく水族館 - 端末セットアップポータル</title>
  <style>
    :root {
      --primary: #00897b;
      --bg: #e0f7fa;
      --card-bg: #ffffff;
    }
    body {
      margin: 0; padding: 20px;
      font-family: sans-serif; background: var(--bg); color: #333;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    .card {
      background: var(--card-bg); padding: 24px; border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px;
      box-sizing: border-box; margin-bottom: 20px;
    }
    h1 { font-size: 1.4rem; color: var(--primary); margin-top: 0; text-align: center; }
    p { font-size: 0.9rem; color: #555; line-height: 1.5; }
    input[type="password"] {
      width: 100%; padding: 12px; font-size: 1rem; border-radius: 8px;
      border: 2px solid #ccc; box-sizing: border-box; margin-bottom: 12px;
    }
    .btn {
      display: block; width: 100%; padding: 12px 0; background: var(--primary);
      color: #fff; text-align: center; text-decoration: none; font-weight: bold;
      border-radius: 8px; border: none; font-size: 1rem; cursor: pointer;
    }
    .btn:active { opacity: 0.9; }
    .dl-item {
      border-bottom: 1px solid #eee; padding: 16px 0;
      display: flex; flex-direction: column; gap: 8px;
    }
    .dl-item:last-child { border-bottom: none; }
    .dl-title { font-weight: bold; color: #004d40; }
    #adminContent { display: none; }
  </style>
</head>
<body>

  <!-- パスワード認証エリア -->
  <div class="card" id="authCard">
    <h1>管理者ログイン</h1>
    <p>端末セットアップ用のパスワードを入力してください。</p>
    <input type="password" id="passInput" placeholder="パスワード">
    <button class="btn" onclick="checkPassword()">ログイン</button>
  </div>

  <!-- ダウンロードエリア（ログイン後表示） -->
  <div class="card" id="adminContent">
    <h1>⚙️ 端末インストール</h1>

    <div class="dl-item">
      <div class="dl-title">📱 Android用アプリ (APK)</div>
      <p>受付用タブレット・エサやり端末用</p>
      <a href="downloads/aquarium-app.apk" class="btn" download>APKファイルをダウンロード</a>
    </div>

    <div class="dl-item">
      <div class="dl-title">💻 Windows PC用アプリ (.exe)</div>
      <p>大画面ディスプレイ出力用PC</p>
      <a href="https://github.com/imizucatv/oekaki/releases/download/v1.0.0/aquarium-setup.exe" class="btn" style="background:#0288d1;" download>exeファイルをダウンロード</a>
    </div>

    <div class="dl-item">
      <div class="dl-title">🍏 Mac用アプリ (.dmg)</div>
      <p>大画面ディスプレイ出力用Mac</p>
      <a href="https://github.com/imizucatv/oekaki/releases/download/v1.0.0/aquarium-mac.zip" class="btn" style="background:#5e35b1;" download>Mac用アプリ(zip)をダウンロード</a>
    </div>

    <div class="dl-item">
      <div class="dl-title">🍎 iPad / iPhone (Safari)</div>
      <p>Safariでこのページを開き、共有メニューから「ホーム画面に追加」をタップしてください。</p>
      <a href="index.html" class="btn" style="background:#ff9800;">Webポータルを開く</a>
    </div>
  </div>

  <script>
    function checkPassword() {
      const pass = document.getElementById('passInput').value;
      // 管理用暗証番号（必要に応じて変更してください）
      if (pass === "aqua2026") {
        document.getElementById('authCard').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
      } else {
        alert("パスワードが違います");
      }
    }
  </script>
</body>
</html>
